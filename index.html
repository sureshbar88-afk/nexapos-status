const body=G.map(g=>`<div class="mdg" data-req="${g.required?1:0}" style="margin-bottom:14px"><b>${App.esc(g.name)}${g.required?' <span style="color:var(--red)">*</span>':''}</b>${g.mods.map(x=>D.modifiers.find(y=>y.id===x)).filter(act).map(m=>opt(m,g.type==='single'?'radio':'checkbox','g'+g.id)).join('')}</div>`).join('')+(other.length?`<div class="mdg" data-req="0"><b>Other</b>${other.map(m=>opt(m,'checkbox','og')).join('')}</div>`:'');
if(!body)return App.toast('No modifiers are set up for this item. Add them in Setup, Global Settings.');
App.modal(`<h3 style="margin-top:0">${App.esc(it.name)}</h3>${body}<p style="color:#777;font-size:13px">Applies to every portion of this item on the order.</p><div class="row" style="margin-top:10px"><button style="background:var(--green)" onclick="Order.modSave('${id}')">Done</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
modSave(id){let bad=null;document.querySelectorAll('.mdg[data-req="1"]').forEach(g=>{if(!g.querySelector('.mdc:checked'))bad=g.querySelector('b').textContent});if(bad)return App.toast('Choose an option for '+bad.replace('*','').trim());
const o=DB.order(this.t);o.mods=o.mods||{};const v=[...document.querySelectorAll('.mdc:checked')].map(x=>x.value);if(v.length)o.mods[id]=v;else delete o.mods[id];DB.save();App.closeModal();App.render()},
extraSel(o){const D=DB.d,G=D.addons.custgroups===false?[]:D.custGroups.filter(g=>g.active!==false),R=D.addons.referrals===false?[]:(D.referrals||[]).filter(r=>r.active!==false);return (G.length?`<select class="f" aria-label="Customer group" onchange="Order.setGroup(this.value)"><option value="">Customer group</option>${G.map(g=>`<option${o.group===g.name?' selected':''}>${App.esc(g.name)}</option>`).join('')}</select>`:'')+(R.length?`<select class="f" aria-label="Referral" onchange="Order.setRef(this.value)"><option value="">Referral</option>${R.map(r=>`<option${o.ref===r.name?' selected':''}>${App.esc(r.name)}</option>`).join('')}</select>`:'')},
setGroup(v){const o=DB.order(this.t),g=DB.d.custGroups.find(x=>x.name===v);o.group=v||null;if(o.disc&&o.disc.group)o.disc=null;if(g&&g.pct>0)return this.discGo(g.name,g.pct,true);DB.save();App.render()},
custAsk(){const o=DB.order(this.t);App.modal(`<h3 style="margin-top:0">Customer</h3><input type="search" id="cs1" placeholder="Search by name or phone" oninput="Order.custFind(this.value)"><div id="cres" style="max-height:30vh;overflow:auto;margin:8px 0"></div><div class="row"><button class="pbtn" onclick="Order.custNew()">+ New customer</button>${o.cust?'<button class="pbtn" style="color:var(--red)" onclick="Order.custSet(null)">Remove customer</button>':''}<button style="background:#888;margin-inline-start:auto" onclick="App.closeModal()">Close</button></div>`);this.custFind('')},
custFind(v){v=v.toLowerCase().trim();const L=DB.d.customers.filter(c=>!v||c.name.toLowerCase().includes(v)||(c.phone||'').includes(v)).slice(0,8);document.getElementById('cres').innerHTML=L.map(c=>`<div class="prow"><span><b>${App.esc(c.name)}</b> <small>${App.esc(c.phone||'')}</small></span><button class="pbtn add" onclick="Order.custSet('${c.id}')">Select</button></div>`).join('')||'<p style="color:#777">No customers found.</p>'},
custNew(){App.modal(`<h3 style="margin-top:0">New customer</h3><label class="fld"><span>Name *</span><input type="text" id="nc_n"></label><label class="fld"><span>Phone</span><input type="text" id="nc_p"></label><label class="fld"><span>Email</span><input type="text" id="nc_e"></label><div class="row"><button style="background:var(--green)" onclick="Order.custSave()">Save and select</button><button style="background:#888" onclick="Order.custAsk()">Back</button></div>`)},
custSave(){const D=DB.d,n=document.getElementById('nc_n').value.trim(),p=document.getElementById('nc_p').value.replace(/[^\d+]/g,'');if(!n)return App.toast('Enter a name');if(p&&D.customers.some(x=>(x.phone||'').replace(/\D/g,'')===p.replace(/\D/g,'')))return App.toast('A customer with this phone already exists');const c={id:'c'+Date.now(),name:n,phone:p,email:document.getElementById('nc_e').value.trim(),group:'',notes:'',created:Date.now()};D.customers.push(c);this.custSet(c.id)},
custSet(id){const o=DB.order(this.t),c=id&&DB.d.customers.find(x=>x.id===id);o.cust=id||null;DB.save();App.closeModal();if(c&&c.group&&DB.d.custGroups.some(g=>g.name===c.group))this.setGroup(c.group);else App.render()},
setRef(v){DB.order(this.t).ref=v||null;DB.save()},
discGo(name,pct,grp){const o=DB.order(this.t),f=()=>{o.disc={name,pct};if(grp)o.disc.group=true;DB.save();App.closeModal();App.render()};if(pct>=DB.d.sup.discountAbove)App.sup('discount',f);else f()},
search(v){const hit=DB.loc().periph.scanner&&v.length>3&&DB.d.menu.find(m=>m.code&&m.code===v);if(hit){this.q='';this.chg(hit.id,1);App.toast('Scanned: '+hit.name);return}this.q=v;App.render();const i=document.getElementById('sq');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},
setCovers(v){DB.order(this.t).covers=+v;DB.save()},
back(){App.go('#/dine-in')},
note(){const o=DB.order(this.t);App.modal(`<h3 style="margin-top:0">Kitchen note</h3><input type="text" id="nt" value="${App.esc(o.note)}" placeholder="e.g. No onions"><div class="row" style="margin-top:12px"><button style="background:var(--green)" onclick="Order.saveNote()">Save</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
saveNote(){DB.order(this.t).note=document.getElementById('nt').value;DB.save();App.closeModal();App.render()},
discount(){if(!App.can('discount'))return App.toast('Your role cannot apply discounts');const D=DB.d;App.modal(`<h3 style="margin-top:0">Apply discount</h3><div class="row">${D.discounts.map((d,i)=>d.active===false?'':`<button style="background:var(--blue)" onclick="Order.setDisc(${i})">${App.esc(d.name)} (${d.pct}%)</button>`).join('')}</div><p>Custom: <input type="text" id="dn" placeholder="Name" style="width:44%"> <input type="text" id="dp" placeholder="%" style="width:18%"> <button style="background:var(--green)" onclick="Order.customDisc()">Apply</button></p><button style="background:#888" onclick="App.closeModal()">Cancel</button>`)},
setDisc(i){const d=DB.d.discounts[i];this.discGo(d.name,d.pct)},
customDisc(){const p=parseFloat(document.getElementById('dp').value);if(!(p>0&&p<=100))return App.toast('Enter a percentage from 1 to 100');this.discGo(document.getElementById('dn').value||'Discount',p)},
clearDisc(){DB.order(this.t).disc=null;DB.save();App.render()},
diff(){const o=DB.order(this.t),up={},dn={},md={};for(const i in o.items){const n=o.items[i]-(o.sent[i]||0);if(n>0)up[i]=n;if(o.sent[i]&&JSON.stringify((o.mods||{})[i]||[])!==JSON.stringify((o.sentMods||{})[i]||[]))md[i]=1}for(const i in o.sent){const n=o.sent[i]-(o.items[i]||0);if(n>0)dn[i]=n}return{o,up,dn,md}},
guard(cb){const d=this.diff(),R=DB.d.modifyReasons.filter(r=>r.active!==false);if(!Object.keys(d.dn).length||!R.length)return cb(null);this._cb=cb;
App.modal(`<h3 style="margin-top:0">Change a sent order</h3><p>Items already sent to the kitchen are being removed. Choose a reason.</p><select class="f" id="mrs">${R.map((r,i)=>`<option value="${i}">${App.esc(r.name)}</option>`).join('')}</select><div class="row" style="margin-top:14px"><button style="background:var(--green)" onclick="Order.reasonGo()">Continue</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
reasonGo(){const R=DB.d.modifyReasons.filter(r=>r.active!==false),r=R[+document.getElementById('mrs').value],cb=this._cb;App.closeModal();App.sup('modify',()=>cb(r))},
commit(reason){const d=this.diff(),o=d.o,up=d.up,dn=d.dn,md=d.md;if(!Object.keys(up).length&&!Object.keys(dn).length&&!Object.keys(md).length)return null;
const first=!o.no;if(first){o.no=++DB.d.seq;o.t0=Date.now();o.by=App.userName()}for(const i in up)DB.consume(i,up[i]);const rs=!reason||reason.restock!==false;for(const i in dn){if(rs)DB.restock(i,dn[i]);else DB.wasteItem(i,dn[i],reason?reason.name:'Cancelled item')}
if(Object.keys(dn).length)DB.d.audit.unshift({t:Date.now(),loc:DB.d.loc,type:'modify',no:o.no,table:this.t,reason:reason?reason.name:'',user:App.userName(),restock:rs,items:{...dn},amount:Object.keys(dn).reduce((a,i)=>a+DB.item(i).price*dn[i],0)});
App.log(Object.keys(dn).length?'modify':'order',(first?'New order #':'Order #')+o.no+(first?' placed':' updated')+' for table '+DB.tname(this.t)+': '+Object.keys(up).length+' new item(s) sent'+(Object.keys(dn).length?', '+Object.keys(dn).length+' removed':''));o.sent={...o.items};o.sentMods=JSON.parse(JSON.stringify(o.mods||{}));const tb=DB.d.tables.find(x=>x.n===this.t);if(tb&&tb.status==='free')tb.status='occ';DB.save();return{up,dn,md,o}},
place(){this.guard(rs=>{const r=this.commit(rs);if(!r)return App.toast('Nothing new to send to the kitchen');const KL=DB.d.alt.kitchen,by={};
for(const i in r.up){const m=DB.item(i);(by[m.st]=by[m.st]||[]).push(r.up[i]+' x '+DB.iname(m,KL)+this.modTxt(r.o,i))}
const cx=Object.keys(r.dn).map(i=>'CANCEL '+r.dn[i]+' x '+DB.iname(DB.item(i),KL)),ch=Object.keys(r.md).filter(i=>!r.up[i]).map(i=>'CHANGE '+DB.iname(DB.item(i),KL)+(this.modTxt(r.o,i)||' (no modifiers)'));
if(PrintHub.on())return PrintHub.place(r,this.t);App.modal(`<div class="mono"><b>KITCHEN TICKET  #${r.o.no}</b>\nTable ${App.esc(DB.tname(this.t))}  Covers ${r.o.covers}  ${App.tm()}\n${r.o.note?'NOTE: '+App.esc(r.o.note)+'\n':''}${Object.keys(by).map(s=>'\n['+s.toUpperCase()+'] > '+DB.printerFor(s)+'\n'+by[s].map(App.esc).join('\n')).join('\n')}${cx.length?'\n\n[CANCELLED]\n'+cx.map(App.esc).join('\n'):''}${ch.length?'\n\n[CHANGED]\n'+ch.map(App.esc).join('\n'):''}</div><div class="row noprint" style="margin-top:14px"><button style="background:#222" onclick="window.print()">Print</button><button style="background:var(--green)" onclick="App.closeModal();App.go('#/dine-in')">Done</button></div>`);if(DB.loc().periph.autoPrintKitchen)setTimeout(()=>window.print(),300)})},
billText(o,k,extra){const D=DB.d,cur=D.settings.currency;return App.esc(D.settings.name)+'\n'+App.esc(DB.loc().name+', '+DB.loc().addr1)+'\nTel '+App.esc(DB.loc().phone)+(DB.loc().taxId?'\nTax No '+App.esc(DB.loc().taxId):'')+'\nOrder #'+(o.no||'New')+'  Table '+App.esc(DB.tname(this.t))+'\n'+App.dt()+' '+App.tm()+'\n\n'+
Object.keys(o.items).map(i=>App.esc(o.items[i]+' x '+DB.iname(DB.item(i),D.alt.receipt)+Order.modTxt(o,i))+'  '+App.money((DB.item(i).price+DB.modSum(o,i))*o.items[i])).join('\n')+'\n\nSub Total '+App.money(k.sub)+(o.disc?'\n'+App.esc(o.disc.name)+' ('+o.disc.pct+'%) -'+App.money(k.disc):'')+(k.svc>0?'\nSurcharges '+App.money(k.svc):'')+'\nTax '+App.money(k.tax)+'\nTOTAL '+cur+' '+App.money(k.total)+(extra||'')},
reprint(){const o=DB.order(this.t);if(!Object.keys(o.items).length)return App.toast('Nothing to print');const tb=DB.d.tables.find(x=>x.n===this.t);if(tb&&tb.status==='occ')tb.status='soon';DB.d.audit.unshift({t:Date.now(),loc:DB.d.loc,type:'reprint',no:o.no,table:this.t,reason:'Bill reprinted',user:App.userName()});App.log('reprint','Bill reprinted for table '+DB.tname(this.t));DB.save();
if(PrintHub.on()){PrintHub.bill(this.t,o);return App.toast('Table marked Done Soon')}App.modal(`<div class="mono">${this.billText(o,DB.calc(o))}</div><div class="row noprint" style="margin-top:14px"><button style="background:#222" onclick="window.print()">Print</button><button style="background:var(--green)" onclick="App.closeModal();App.render()">Close</button></div>`);App.toast('Bill printed: table marked Done Soon')},
pay(){if(!App.can('pay'))return App.toast('Your role cannot take payments');const o=DB.order(this.t);if(!Object.keys(o.items).length)return App.toast('No items on this table');this.guard(r=>{this.commit(r);App.go('#/pay/'+this.t)})},
voidAsk(){if(!App.can('void'))return App.toast('Your role cannot void orders');const R=DB.d.cancelReasons.filter(r=>r.active!==false);App.modal(`<h3 style="margin-top:0">Void this order</h3><p>Reason</p><select class="f" id="vr">${R.map((r,i)=>`<option value="${i}">${App.esc(r.name)}</option>`).join('')||'<option value="-1">Voided</option>'}</select><div class="row" style="margin-top:12px"><button style="background:var(--red)" onclick="Order.doVoid()">Void order</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
doVoid(){const R=DB.d.cancelReasons.filter(r=>r.active!==false),r=R[+document.getElementById('vr').value]||{name:'Voided',restock:true};App.sup('void',()=>{const o=DB.order(this.t),k=DB.calc(o),rs=r.restock!==false;for(const i in o.sent){if(rs)DB.restock(i,o.sent[i]);else DB.wasteItem(i,o.sent[i],r.name)}
if(o.no){DB.d.voids.push({no:o.no,table:this.t,total:k.total,reason:r.name,time:Date.now()});App.log('void','Order #'+o.no+' voided at table '+DB.tname(this.t)+' ('+r.name+')');DB.d.audit.unshift({t:Date.now(),loc:DB.d.loc,type:'void',no:o.no,table:this.t,reason:r.name,user:App.userName(),restock:rs,amount:k.total})}
delete DB.d.orders[this.t];const tb0=DB.d.tables.find(x=>x.n===this.t);if(tb0)tb0.status='free';DB.save();App.closeModal();App.toast('Order voided');App.go(this.t>=1000?'#/walk-in':'#/dine-in')})},
free(){return DB.d.tables.filter(x=>x.status==='free'&&x.n!==this.t)},
splitAsk(){const o=DB.order(this.t),ids=Object.keys(o.items),f=this.free();if(!ids.length)return App.toast('No items to split');if(!f.length)return App.toast('No free table available');
App.modal(`<h3 style="margin-top:0">Split Table ${App.esc(DB.tname(this.t))}</h3><p>Tick the items to move:</p>${ids.map(i=>`<label class="prow"><span><input type="checkbox" class="spc" value="${i}"> ${App.esc(DB.item(i).name)}</span><b>x${o.items[i]}</b></label>`).join('')}<p>Move to table <select class="f" id="sptt">${f.map(x=>`<option value="${x.n}">${App.esc(x.name)}</option>`).join('')}</select></p><div class="row"><button style="background:var(--green)" onclick="Order.doSplit()">Split</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
doSplit(){const mv=[...document.querySelectorAll('.spc:checked')].map(x=>x.value),tt=+document.getElementById('sptt').value;if(!mv.length)return App.toast('Tick at least one item');
const o=DB.order(this.t),n=DB.order(tt);mv.forEach(i=>{n.items[i]=(n.items[i]||0)+o.items[i];const s=Math.min(o.sent[i]||0,o.items[i]);if(s)n.sent[i]=(n.sent[i]||0)+s;delete o.items[i];delete o.sent[i]});
n.no=n.no||++DB.d.seq;n.covers=1;DB.d.tables.find(x=>x.n===tt).status='occ';
if(!Object.keys(o.items).length){delete DB.d.orders[this.t];DB.d.tables.find(x=>x.n===this.t).status='free'}DB.save();App.closeModal();App.toast('Moved to table '+DB.tname(tt));
App.go(Object.keys(o.items).length?'#/order/'+this.t:'#/order/'+tt);App.render()},
moveAsk(){const f=this.free();if(!f.length)return App.toast('No free table available');App.modal(`<h3 style="margin-top:0">Move order to</h3><select class="f" id="mvt">${f.map(x=>`<option value="${x.n}">${App.esc(x.name)}</option>`).join('')}</select><div class="row" style="margin-top:14px"><button style="background:var(--green)" onclick="Order.doMove()">Move</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
doMove(){const tt=+document.getElementById('mvt').value,D=DB.d,a=D.tables.find(x=>x.n===this.t),b=D.tables.find(x=>x.n===tt);D.orders[tt]=D.orders[this.t];delete D.orders[this.t];b.status=a.status==='free'?'occ':a.status;a.status='free';DB.save();App.closeModal();App.toast('Order moved to table '+DB.tname(tt));App.go('#/order/'+tt)}};
App.register('order',Order);
</script><script>/* SCREEN 3: Bill settlement. Split payments: cash, cards and customer accounts (pending bills). */
const Pay={t:0,m:'cash',amt:'',kb:'',pg:0,
icon(m){if(m.id==='cash')return '<svg width="64" height="40" viewBox="0 0 64 40"><rect x="2" y="4" width="60" height="32" rx="4" fill="#7ee27a" stroke="#3fae3a"/><circle cx="32" cy="20" r="9" fill="#2fa84a"/><text x="32" y="25" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">$</text></svg>';
if(m.id==='mc')return '<svg width="64" height="40" viewBox="0 0 64 40"><circle cx="24" cy="20" r="14" fill="#eb001b"/><circle cx="40" cy="20" r="14" fill="#f79e1b" fill-opacity=".9"/></svg>';
if(m.id==='visa')return '<svg width="64" height="40" viewBox="0 0 64 40"><text x="32" y="27" text-anchor="middle" font-size="22" font-style="italic" font-weight="800" fill="#1a4fa0">VISA</text></svg>';return ''},
state(t){const D=DB.d,o=DB.order(t),k=DB.calc(o),total=r3(k.total),paid=r3(o.pays.reduce((s,p)=>s+p.amt,0));return{D,o,k,total,paid,rem:r3(Math.max(0,total-paid))}},
render(t){if(!App.can('pay'))return App.denied('payments');this.t=+t;const s=this.state(this.t),D=s.D,M=D.methods.find(x=>x.id===this.m)||D.methods[0],cur=D.settings.currency;
if(!Object.keys(s.o.items).length)return '<div class="wrap"><div class="card">Nothing to pay. <a href="#/dine-in">Back to tables</a></div></div>';
if(this.amt==='')this.amt=s.rem.toFixed(D.settings.decimals);
return `<div class="wrap" style="max-width:860px;margin:0 auto;width:100%"><div class="card" style="text-align:center;padding:26px"><div style="color:#aaa;letter-spacing:1px">${App.t(s.paid>0?'BALANCE DUE':'TOTAL AMOUNT')} (${cur})</div><div class="payamt">${App.money(s.paid>0?s.rem:s.total)}</div>
${s.paid>0?`<div style="color:#777">Bill ${App.money(s.total)} &middot; Paid ${App.money(s.paid)}</div>`:''}
${s.o.pays.map((p,i)=>`<div class="prow" style="max-width:420px;margin:6px auto 0"><span>${App.esc(p.name)}${p.type==='account'?' <small>(pending bill)</small>':''}</span><span><b>${App.money(p.amt)}</b> <a href="javascript:Pay.rm(${i})" aria-label="Remove payment" style="color:#c33;text-decoration:none">&times;</a></span></div>`).join('')}</div>
${s.rem>0?`<div class="row"><div class="arow"><button aria-label="Keypad" onclick="Pay.kp()">&#9638;</button><input type="text" id="pa" inputmode="decimal" value="${this.amt}" oninput="Pay.amt=this.value" onfocus="this.select()"></div><button class="sel" onclick="Pay.pick(0)">${App.esc(M.name)} &#9662;</button></div>`:'<div class="card" style="text-align:center;color:#2a7">Bill fully covered. Complete the payment.</div>'}
<div class="row" style="justify-content:space-between;background:#e6e6e6;padding:10px 14px;border-radius:4px"><b style="color:#999">${this.t>=1000?'':App.t('Table')+' '}${App.esc(DB.tname(this.t))}</b><span class="row"><button style="background:#fff;color:#222;border:1px solid #ccc" onclick="Pay.back()">${App.t('Back')}</button>${s.rem>0?`<button style="background:#3aa3c8;padding:10px 30px" onclick="Pay.add()">${App.t('Add')}</button>`:`<button style="background:#2db36f;padding:10px 30px" onclick="Pay.settle()">${App.t('Complete')}</button>`}</span></div></div>`},
back(){App.go(this.t>=1000?'#/walk-in/'+this.t:'#/order/'+this.t)},
rm(i){DB.order(this.t).pays.splice(i,1);this.amt='';DB.save();App.render()},
pick(pg){this.pg=pg;const ms=DB.d.methods.filter(m=>m.active!==false),n=Math.max(1,Math.ceil(ms.length/8));

D.sales.push({no:9000+D.sales.length,table:1+Math.floor(rnd()*8),total,sub,discAmt:disc,svc:0,tax,type:'Dine-In',by:staff[Math.floor(rnd()*3)],covers:1+Math.floor(rnd()*4),pays:[{m:pm.name.toLowerCase(),name:pm.name,type:pm.type,amt:total}],change:0,items,disc:dp?{name:'Loyalty',pct:dp}:null,time:d0-d*864e5+(11+Math.floor(rnd()*12))*36e5+Math.floor(rnd()*36e5),sample:true})}if(rnd()<0.6)D.voids.push({no:9500+d,table:2,total:5+Math.floor(rnd()*20),reason:'Customer left',time:d0-d*864e5+15*36e5,sample:true})}
const cs=['Ahmed Al Balushi','Sara Khan','John Smith','Fatma Al Harthy'].map((n,i)=>({id:'cs'+i,name:n,phone:'9000000'+i,email:'',group:'',notes:'',created:d0-(8+i*3)*864e5,sample:true}));cs.push({id:'cs9',name:'Old Customer',phone:'90000099',email:'',group:'',notes:'',created:d0-45*864e5,sample:true});D.customers.push(...cs);const ml=D.modifiers.filter(m=>m.active!==false);
D.sales.filter(s=>s.sample).forEach(s=>{if(rnd()<0.6)s.cust=cs[Math.floor(rnd()*4)].id;s.area=((D.tables.find(t=>t.n===s.table)||{}).area)||'';s.building='Main building';if(rnd()<0.25){s.ref='Hotel Partner';s.refAmt=s.total*0.05}if(rnd()<0.15)s.type='Delivery';else if(rnd()<0.1)s.type='Walk-In';if(rnd()<0.15)s.svc=s.sub*0.1;if(ml.length&&rnd()<0.5){const i=Object.keys(s.items)[0],mm=ml[Math.floor(rnd()*ml.length)];s.modsN={[i]:[{n:mm.name,p:mm.price}]}}});
for(let k=0;k<3;k++){const m=it[Math.floor(rnd()*it.length)];D.audit.unshift({t:d0-(k+1)*864e5+14*36e5,loc:D.loc,type:'modify',no:9000+k,table:3,reason:'Customer changed mind',user:staff[1],restock:true,items:{[m.id]:1},amount:m.price,sample:true})}
D.sales.sort((a,b)=>a.time-b.time);DB.save();App.toast('Sample sales created. Remove them any time.');App.render()},
undemo(){const D=DB.d;D.sales=D.sales.filter(s=>!s.sample);D.voids=D.voids.filter(v=>!v.sample);D.customers=D.customers.filter(c=>!c.sample);D.audit=D.audit.filter(a=>!a.sample);DB.save();App.toast('Sample sales removed');App.render()},
sugg(m){const D=DB.d,now=Date.now(),from=now-14*864e5;let sold=0,first=now;D.sales.forEach(s=>{if(s.time>=from){sold+=s.items[m.id]||0;first=Math.min(first,s.time)}});const span=Math.max(1,Math.min(14,(now-first)/864e5)),need=Math.ceil(sold/span*(D.ai.leadDays+D.ai.coverDays)*1.3)-DB.stockOf(m);return need>0?need:(DB.stockOf(m)<=D.misc.lowStock?D.misc.lowStock*2-DB.stockOf(m):0)}};

</script><script>/* Inventory & Recipe: AI overview, ingredients, suppliers, purchasing, recipes and food cost, stock take, transfers, waste, reports. */
const Inv={tab:'overview',q:'',cat:'All',low:false,poF:'all',rep:'valuation',po:null,rc:null,tk:null,
TABS:[['overview','Overview'],['ingredients','Ingredients'],['suppliers','Suppliers'],['purchasing','Purchasing'],['recipes','Recipes'],['stocktake','Stock Take'],['transfers','Transfers'],['waste','Waste'],['reports','Reports']],
nav:'Inventory',order:6,
I:id=>DB.d.ingredients.find(x=>x.id===id),S:id=>DB.d.suppliers.find(x=>x.id===id),st:id=>DB.d.stock[id]||0,fq:n=>String(+(+n).toFixed(3)),fm:n=>App.money(n),e:s=>App.esc(s==null?'':s),

chip(t,c){return `<span class="pill" style="background:${c}">${t}</span>`},
/* ---------- core numbers ---------- */
usage(id,days){days=days||14;const from=this.now()-days*864e5;let sum=0,first=this.now();DB.d.slog.forEach(l=>{if(l.i===id&&l.y==='sale'&&l.t>=from){sum+=-l.q;first=Math.min(first,l.t)}});if(!sum)return 0;return sum/Math.max(1,Math.min(days,(this.now()-first)/864e5))},
sugg(id){const g=this.I(id),D=DB.d,sp=this.S(g.sup),lead=sp?sp.lead:D.ai.leadDays,u=this.usage(id),q=Math.max(g.par-this.st(id),u*(lead+D.ai.coverDays)*1.2-this.st(id));return q<=0?0:(g.unit==='pc'?Math.ceil(q):Math.ceil(q*10)/10)},
onOrder(id){return DB.d.pos.filter(p=>['draft','sent','partial'].includes(p.status)).reduce((a,p)=>a+p.lines.filter(l=>l.i===id).reduce((b,l)=>b+Math.max(0,l.q-(l.r||0)),0),0)},
foodCostPct(){const D=DB.d,from=this.now()-30*864e5;let c=0,r=0;D.sales.forEach(s=>{if(s.time>=from)for(const i in s.items){const it=DB.item(i),k=it&&DB.costOf(i);if(k!=null){c+=k*s.items[i];r+=it.price*s.items[i]}}});return r?c/r*100:null},
insights(){const D=DB.d,I=[],cur=D.settings.currency,ings=D.ingredients.filter(x=>x.active!==false);
ings.forEach(g=>{const u=this.usage(g.id),sp=this.S(g.sup),lead=sp?sp.lead:D.ai.leadDays;if(u>0){const c=this.st(g.id)/u;if(c<lead+1)I.push({l:'warn',t:`${g.name} will run out in about ${Math.max(0,c).toFixed(1)} day(s). Suggested order: ${this.fq(this.sugg(g.id))} ${g.unit}.`})}});
const low=ings.filter(g=>this.st(g.id)<=g.reorder&&this.st(g.id)>=0);if(low.length)I.push({l:'warn',t:`${low.length} ingredient(s) are at or below the reorder level.`,a:['Create purchase orders','Inv.autoPO()']});
const neg=ings.filter(g=>this.st(g.id)<0);if(neg.length)I.push({l:'bad',t:`${neg.length} ingredient(s) have negative stock (${neg.slice(0,3).map(g=>g.name).join(', ')}). Receive missing deliveries or run a stock take.`,a:['Start a stock take',"Inv.go('stocktake')"]});
ings.forEach(g=>{if(g.prev&&g.cost>g.prev*1.1)I.push({l:'warn',t:`Price of ${g.name} rose ${((g.cost/g.prev-1)*100).toFixed(0)}% on the last delivery (${this.fm(g.prev)} to ${this.fm(g.cost)} per ${g.unit}).`})});
const T=D.inv.targetCost,over=D.menu.map(m=>{const c=DB.costOf(m.id);return c!=null&&m.price>0?{m,c,p:c/m.price*100}:null}).filter(x=>x&&x.p>T).sort((a,b)=>b.p-a.p);over.slice(0,3).forEach(x=>I.push({l:'warn',t:`${x.m.name} costs ${x.p.toFixed(0)}% of its price (target ${T}%). A price of ${this.fm(x.c/(T/100))} would reach the target.`}));
const wk=this.now()-14*864e5,wr={};D.waste.filter(w=>w.t>=wk).forEach(w=>wr[w.reason]=(wr[w.reason]||0)+w.cost);const wt=Object.keys(wr).sort((a,b)=>wr[b]-wr[a])[0];if(wt&&wr[wt]>0)I.push({l:'info',t:`Biggest waste reason in the last 14 days: ${wt} (${cur} ${this.fm(wr[wt])}).`});
const slow=ings.filter(g=>this.st(g.id)>g.par&&!this.usage(g.id,14)&&D.slog.length>0);if(slow.length)I.push({l:'info',t:`${slow.length} ingredient(s) are above their par level and unused for 14 days: ${slow.slice(0,3).map(g=>g.name).join(', ')}.`});
D.pos.filter(p=>['sent','partial'].includes(p.status)&&p.sent&&this.now()-p.sent>((this.S(p.sup)||{lead:2}).lead+1)*864e5).forEach(p=>I.push({l:'warn',t:`${p.no} to ${(this.S(p.sup)||{}).name||'supplier'} is overdue. Follow up with the supplier.`}));
const nm=D.menu.filter(m=>!DB.need(m.id)&&m.cat!==9&&m.st!=='Bar').length;if(nm)I.push({l:'info',t:`${nm} food item(s) have no recipe, so their ingredients are not tracked or costed.`,a:['Open recipes',"Inv.go('recipes')"]});
if(!I.length)I.push({l:'good',t:'Everything looks healthy. Stock levels, costs and purchases are on track.'});return I},
/* ---------- overview ---------- */
t_overview(){const D=DB.d,cur=D.settings.currency,ings=D.ingredients.filter(x=>x.active!==false),val=ings.reduce((a,g)=>a+Math.max(0,this.st(g.id))*g.cost,0),low=ings.filter(g=>this.st(g.id)<=g.reorder),neg=ings.filter(g=>this.st(g.id)<0),op=D.pos.filter(p=>['draft','sent','partial'].includes(p.status)),wk=this.now()-7*864e5,ws=D.waste.filter(w=>w.t>=wk).reduce((a,w)=>a+w.cost,0),fc=this.foodCostPct(),I=this.insights(),col={bad:'#d9363e',warn:'#e07b00',info:'#0b6fd6',good:'#2a7'};
const bycat={};ings.forEach(g=>bycat[g.cat]=(bycat[g.cat]||0)+Math.max(0,this.st(g.id))*g.cost);const mx=Math.max(1,...Object.values(bycat));

<div class="card" style="margin-top:14px"><div class="row"><b>AI insights</b><span style="margin-inline-start:auto" class="row"><button class="btng" onclick="Inv.autoPO()">Auto-generate purchase orders</button></span></div><ul style="list-style:none;padding:0;margin:10px 0 0">${I.map(x=>`<li style="padding:8px 0;border-top:1px solid #eee;display:flex;gap:10px;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:${col[x.l]};flex:0 0 10px"></span><span style="flex:1">${this.e(x.t)}</span>${x.a?`<button class="pbtn" style="font-size:13px" onclick="${x.a[1]}">${x.a[0]}</button>`:''}</li>`).join('')}</ul></div>
<div class="split" style="margin-top:14px"><div class="card" style="flex:1.4"><b>Needs reordering</b>${this.tbl(['Ingredient','Stock','Reorder at','On order','Suggested','Supplier'],need.map(x=>`<tr><td>${this.e(x.g.name)}</td><td>${this.fq(this.st(x.g.id))} ${x.g.unit}</td><td>${this.fq(x.g.reorder)}</td><td>${this.fq(this.onOrder(x.g.id))}</td><td><b>${this.fq(x.q)}</b></td><td>${this.e((this.S(x.g.sup)||{}).name||'No supplier')}</td></tr>`),'Nothing needs reordering.')}</div>
<div class="card" style="flex:1"><b>Stock value by category</b>${Object.keys(bycat).map(k=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${this.e(k)}</span><span>${this.fm(bycat[k])}</span></div><div style="background:#e8eef7;height:10px;border-radius:5px"><div style="background:var(--blue);height:10px;border-radius:5px;width:${bycat[k]/mx*100}%"></div></div></div>`).join('')}</div></div>`},

const row=g=>{const s=this.st(g.id),state=s<0?this.chip('Negative','#d9363e'):s<=g.reorder?this.chip('Low','#e07b00'):this.chip('OK','#2a7');return `<tr><td>${e(g.name)}${g.active===false?' <small>(inactive)</small>':''}</td><td>${e(g.cat)}</td><td>${this.stk(g,s)}</td><td>${this.cu(g)}</td><td>${this.rp(g)}</td><td>${e((this.S(g.sup)||{}).name||'')}</td><td>${state}</td><td style="white-space:nowrap"><button class="pbtn" style="font-size:13px" onclick="Inv.adjAsk('${g.id}')">Adjust</button> <button class="editg" style="padding:6px 14px;height:auto" onclick="Inv.ingAsk('${g.id}')">Edit</button></td></tr>`};
return `<div class="row" style="margin-bottom:12px"><div class="sbox" style="width:260px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2.5"><circle cx="10" cy="10" r="7"/><path d="M15 15l7 7"/></svg><input type="search" placeholder="Search ingredients" value="${e(this.q)}" oninput="Inv.search(this.value)"></div><select class="f" onchange="Inv.grp=this.value;App.render()">${['All','Food','Beverage'].map(x=>`<option${x===(this.grp||'All')?' selected':''}>${x}</option>`).join('')}</select><select class="f" onchange="Inv.cat=this.value;App.render()">${cats.map(c=>`<option${c===this.cat?' selected':''}>${e(c)}</option>`).join('')}</select><label class="row" style="gap:6px"><input type="checkbox" style="width:20px;height:20px" ${this.low?'checked':''} onchange="Inv.low=this.checked;App.render()"> Low stock only</label><span style="margin-inline-start:auto" class="row"><button class="gbtn" onclick="Inv.catAsk()">Categories</button><button class="btng" onclick="Inv.ingAsk(null)">+ Add ingredient</button></span></div>${this.tbl(['Ingredient','Category','In stock','Cost','Reorder / Par','Supplier','Status',''],L.map(row),'No ingredients match.')}`},

ingSave(id){const D=DB.d,v=k=>document.getElementById(k),n=v('ig_n').value.trim(),c=parseFloat(v('ig_p').value),r=parseFloat(v('ig_r').value),p=parseFloat(v('ig_pa').value),t=parseFloat(v('ig_t').value)||0;

poNew(sup){const D=DB.d;return{id:'po'+Date.now()+Math.floor(Math.random()*99),no:'PO-'+String(D.inv.poSeq++).padStart(4,'0'),sup,status:'draft',date:this.now(),exp:'',note:'',lines:[],rec:[]}},
autoPO(){const D=DB.d,by={};D.ingredients.filter(g=>g.active!==false&&g.sup).forEach(g=>{const s=this.st(g.id),u=this.usage(g.id),sp=this.S(g.sup),lead=sp?sp.lead:2,c=u>0?s/u:Infinity;if(s<=g.reorder||c<lead+1){let q=this.sugg(g.id)-this.onOrder(g.id);if(q>0){q=g.unit==='pc'?Math.ceil(q):Math.ceil(q*10)/10;(by[g.sup]=by[g.sup]||[]).push({i:g.id,q,c:g.cost,r:0})}}});

recvGo(){const D=DB.d,p=D.pos.find(x=>x.id===this.rid),got=[];let bad=null;p.lines.forEach((l,i)=>{const q=parseFloat(document.getElementById('rq'+i).value)||0,c=parseFloat(document.getElementById('rc'+i).value);if(q<0||isNaN(c)||c<0)bad='Check the quantities and costs';if(q>0)got.push({i:l.i,q,c,k:i})});if(bad)return App.toast(bad);if(!got.length)return App.toast('Enter a received quantity');

xForm(o){const D=DB.d,others=o||D.locations.filter(l=>l.id!==D.loc),e=this.e;App.modal(`<div style="width:min(620px,86vw)"><h3 style="margin-top:0">${this.xk==='send'?'Send stock to another location':'Request stock from another location'}</h3><label class="fld"><span>${this.xk==='send'?'Send to':'Request from'}</span><select class="f" id="xl_o">${others.map(l=>`<option value="${l.id}">${e(l.name)}</option>`).join('')}</select></label>${this.tbl(['Ingredient','Qty',''],this.xl.map((l,i)=>{const g=this.I(l.i);return `<tr><td>${e(g.name)}</td><td>${l.q} ${g.unit}</td><td><button class="pbtn" style="color:var(--red)" onclick="Inv.xl.splice(${i},1);Inv.xForm()">&times;</button></td></tr>`}),'No lines yet.')}<div class="row" style="margin:10px 0"><select class="f" id="xl_i">${D.ingredients.filter(g=>g.active!==false).map(g=>`<option value="${g.id}">${e(g.name)} (${this.fq(this.st(g.id))} ${g.unit} here)</option>`).join('')}</select><input type="text" id="xl_q" placeholder="Qty" style="width:90px"><button class="pbtn add" onclick="Inv.xAdd()">+ Add</button></div><div class="row"><button style="background:var(--green)" onclick="Inv.xSave()">${this.xk==='send'?'Send now':'Send request'}</button><button style="background:#888;margin-inline-start:auto" onclick="App.closeModal()">Cancel</button></div></div>`);const sel=document.getElementById('xl_o');if(this.xo)sel.value=this.xo},

/* ---------- waste ---------- */
t_waste(){const D=DB.d,e=this.e,cur=D.settings.currency,from=this.now()-30*864e5,W=D.waste.filter(w=>w.t>=from),by={};W.forEach(w=>by[w.reason]=(by[w.reason]||0)+w.cost);const tot=W.reduce((a,w)=>a+w.cost,0);

wAsk(){const D=DB.d,e=this.e;App.modal(`<h3 style="margin-top:0">Log waste</h3><label class="fld"><span>What was wasted?</span><select class="f" id="w_i"><optgroup label="Ingredients">${D.ingredients.filter(g=>g.active!==false).map(g=>`<option value="i:${g.id}">${e(g.name)} (${this.fq(this.st(g.id))} ${g.unit})</option>`).join('')}</optgroup><optgroup label="Menu items (ready dishes)">${D.menu.map(m=>`<option value="m:${m.id}">${e(m.name)}</option>`).join('')}</optgroup></select></label><label class="fld"><span>Quantity</span><input type="text" id="w_q"></label><label class="fld"><span>Reason</span><select class="f" id="w_r">${D.inv.wasteReasons.map(r=>`<option>${e(r)}</option>`).join('')}</select></label><div class="row"><button style="background:var(--green)" onclick="Inv.wGo()">Log waste</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
wGo(){const D=DB.d,v=document.getElementById('w_i').value,q=parseFloat(document.getElementById('w_q').value),r=document.getElementById('w_r').value;if(!(q>0))return App.toast('Enter a quantity');const id=v.slice(2),by=App.userName();

/* ---------- reports ---------- */
report(k){const D=DB.d,cur=D.settings.currency,T=D.inv.targetCost,e=this.e,ings=D.ingredients,f=this.fm,R={};
if(k==='valuation'){let t=0;const rows=ings.map(g=>{const v=Math.max(0,this.st(g.id))*g.cost;t+=v;return [g.name,g.cat,this.fq(this.st(g.id)),g.unit,f(g.cost),f(v)]});rows.push(['TOTAL','','','','',f(t)]);return{t:'Stock valuation',c:['Ingredient','Category','Quantity','Unit','Cost / unit','Value ('+cur+')'],r:rows}}

if(k==='foodcost')return{t:'Food costing',c:['Menu item','Price','Recipe cost','Food cost %','Margin','Price for target'],r:D.menu.filter(m=>DB.need(m.id)).map(m=>{const c=DB.costOf(m.id);return [m.name,f(m.price),f(c),(m.price?c/m.price*100:0).toFixed(1)+'%',f(m.price-c),f(c/(T/100))]})};
if(k==='engineering'){const from=this.now()-30*864e5,q={};D.sales.forEach(s=>{if(s.time>=from)for(const i in s.items)q[i]=(q[i]||0)+s.items[i]});const it=D.menu.filter(m=>DB.need(m.id)).map(m=>({m,q:q[m.id]||0,mg:m.price-DB.costOf(m.id)})),aq=it.reduce((a,x)=>a+x.q,0)/(it.length||1),am=it.reduce((a,x)=>a+x.mg,0)/(it.length||1);

if(k==='purchases'){const from=this.now()-30*864e5,by={};D.pos.forEach(p=>p.rec.forEach(r=>{if(r.t>=from){const s=(this.S(p.sup)||{name:'?'}).name;by[s]=by[s]||{n:0,t:0};by[s].n++;by[s].t+=r.total}}));return{t:'Purchases by supplier (last 30 days)',c:['Supplier','Deliveries','Total ('+cur+')'],r:Object.keys(by).map(s=>[s,by[s].n,f(by[s].t)])}}
if(k==='variance')return{t:'Stock take variance and waste',c:['Date','Stock take','Items counted','Variance value'],r:D.counts.filter(c=>c.status==='done').map(c=>[this.day(c.done),c.name,c.lines.filter(l=>l.c!=null).length,f(c.vv||0)])};
return{t:'',c:[],r:[]}},
t_reports(){const K=[['valuation','Stock valuation'],['usage','Usage and cover'],['foodcost','Food costing'],['engineering','Menu engineering'],['purchases','Purchases'],['variance','Variance']],r=this.report(this.rep);
return `<div class="row" style="margin-bottom:12px">${K.map(([k,l])=>`<button class="cat${this.rep===k?' on':''}" onclick="Inv.rep='${k}';App.render()">${l}</button>`).join('')}<button class="gbtn" style="margin-inline-start:auto" onclick="Inv.csv()">Export CSV</button></div><h3 style="margin-top:0">${r.t}</h3>${this.tbl(r.c,r.r.map(x=>`<tr>${x.map(c=>`<td>${this.e(c)}</td>`).join('')}</tr>`),'No data yet.')}`},

draw(){const s=this.st,el=document.getElementById('mapsurf');if(!el||this.mode==='lf')return;const b=document.getElementById('mapbox');b.style.aspectRatio=s.img&&s.imgW?s.imgW+'/'+s.imgH:'';
el.innerHTML=`<div class="mfb" style="transform:scale(${s.z});transform-origin:${s.px}% ${s.py}%" onclick="MapView.pick(event)">${s.img?`<img src="${s.img}" alt="Store map">`:'<div class="mgrid"></div><div class="mnote">The live map loads when you are online in the downloaded app. You can also upload a map image.</div>'}<span class="mpin" style="left:${s.px}%;top:${s.py}%">${PIN}</span></div>`;document.getElementById('mcredit').textContent=s.img?'Uploaded map image':'Offline map';this.coord()},
coord(){const s=this.st,e=document.getElementById('mcoord');if(e)e.textContent=s.lat!=null?'Pin: '+s.lat.toFixed(5)+', '+s.lng.toFixed(5):'Pin: not set yet. Type a plus code in Address, or click the map.'},
pick(e){const r=e.currentTarget.getBoundingClientRect(),s=this.st;s.px=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));s.py=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));this.moved=true;this.draw()},
zoom(d){if(this.mode==='lf'&&this.map)return this.map.setZoom(this.map.getZoom()+d);const s=this.st;s.z=Math.max(1,Math.min(4,s.z+d*0.5));this.draw()},
full(){const b=document.getElementById('mapbox');try{(b.requestFullscreen||b.webkitRequestFullscreen).call(b)}catch(e){App.toast('Fullscreen is not available here')}},
setPin(lat,lng){const s=this.st;s.lat=lat;s.lng=lng;this.moved=true;if(this.mode==='lf'&&this.map){this.marker.setLatLng([lat,lng]);this.map.setView([lat,lng],17)}this.coord()},
async search(v){v=(v||'').trim();if(!v)return;const p=Geo.parse(v,this.ref());if(p){this.setPin(p.lat,p.lng);return App.toast('Pin placed')}
if(this.mode!=='lf')return App.toast('Place search needs the online map. You can type coordinates or a plus code.');
try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(v)),j=await r.json();if(j[0])this.setPin(+j[0].lat,+j[0].lon);else App.toast('Place not found')}catch(e){App.toast('Search needs an internet connection')}},
fromAddress(){const a=document.getElementById('lf_addr1').value,p=Geo.isPlus(a)?Geo.parse(a,this.ref()):null;if(!p)return App.toast('The address is not a plus code. Use the search box for a place name when online.');this.setPin(p.lat,p.lng);App.toast('Pin placed from the plus code')},
upload(f){if(!f)return;if(!/^image\//.test(f.type))return App.toast('Choose an image file');const rd=new FileReader();rd.onerror=()=>App.toast('Could not read the file');
rd.onload=()=>{const im=new Image();im.onerror=()=>App.toast('That image could not be opened');im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
const s=this.st;s.img=c.toDataURL('image/jpeg',0.82);s.imgW=w;s.imgH=h;s.px=50;s.py=50;s.z=1;this.moved=true;if(this.mode==='lf')this.mode='fb';this.draw();App.toast('Map image loaded. Click it to place the pin, then press Update.')};im.src=rd.result};rd.readAsDataURL(f)},
clearImg(){const s=this.st;s.img=null;s.imgW=0;s.imgH=0;this.draw()},
commit(l,addr){const s=this.st;if(!s)return;if(!this.moved&&Geo.isPlus(addr)){const p=Geo.parse(addr,this.ref());if(p){s.lat=p.lat;s.lng=p.lng}}Object.assign(l,{lat:s.lat,lng:s.lng,mapImg:s.img,imgW:s.imgW,imgH:s.imgH,pinX:s.px,pinY:s.py})},
probe(){if(this.loading||this.st.img)return;this.loading=true;let done=false;const im=new Image();im.onload=()=>{if(!done){done=true;this.loadLeaflet()}};im.onerror=()=>{done=true;this.loading=false};setTimeout(()=>{done=true;this.loading=false},6000);im.src='https://tile.openstreetmap.org/0/0/0.png'},
loadLeaflet(){const go=()=>{this.loading=false;const el=document.getElementById('mapsurf');if(!window.L||!el||this.st.img)return;el.innerHTML='';this.mode='lf';const s=this.st,c=[s.lat==null?23.588:s.lat,s.lng==null?58.383:s.lng];
this.map=L.map(el,{zoomControl:false,attributionControl:false}).setView(c,s.lat==null?12:16);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(this.map);
this.marker=L.marker(c,{draggable:true,icon:L.divIcon({html:PIN,className:'',iconSize:[30,42],iconAnchor:[15,42]})}).addTo(this.map);
this.marker.on('dragend',e=>{const p=e.target.getLatLng();s.lat=p.lat;s.lng=p.lng;this.moved=true;this.coord()});this.map.on('click',e=>{this.marker.setLatLng(e.latlng);s.lat=e.latlng.lat;s.lng=e.latlng.lng;this.moved=true;this.coord()});
document.getElementById('mcredit').innerHTML='&copy; OpenStreetMap contributors';this.coord()};
if(window.L)return go();const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';const js=document.createElement('script');js.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';js.onload=go;js.onerror=()=>{this.loading=false};document.head.append(css,js)}};
document.addEventListener('fullscreenchange',()=>{if(MapView.map)setTimeout(()=>MapView.map.invalidateSize(),150)});
</script><script>/* Setup > Locations > Edit Location (8 areas). Also Payment Methods and Help Links. Owner and Manager only. */
const Shifts={
panel(){const D=DB.d,s=D.shift,cur=D.settings.currency;return s?`<div class="card row"><span>Shift <b>${App.esc(s.name)}</b> open since ${new Date(s.start).toLocaleTimeString()} by ${App.esc(s.user)} &middot; opening cash ${cur} ${App.money(s.float)}</span><button style="margin-inline-start:auto;background:#555" onclick="Shifts.closeAsk()">Close shift</button></div>`:`<div class="card row"><span style="color:var(--red)">No shift is open.</span><button style="margin-inline-start:auto;background:var(--green)" onclick="Shifts.openAsk()">Open shift</button></div>`},
bar(){return DB.loc().shifts.enabled?this.panel():''},
openAsk(){if(!App.can('shift'))return App.toast('Your role cannot open or close shifts');const L=DB.loc();App.modal(`<h3 style="margin-top:0">Open shift</h3><label class="fld"><span>Shift</span><select class="f" id="shn">${L.shifts.list.map(x=>`<option>${App.esc(x.name)}</option>`).join('')}</select></label><label class="fld"><span>Opening cash (${DB.d.settings.currency})</span><input type="text" id="shf" value="0.000"></label><div class="row"><button style="background:var(--green)" onclick="Shifts.doOpen()">Open</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
doOpen(){const f=parseFloat(document.getElementById('shf').value);if(isNaN(f)||f<0)return App.toast('Enter the opening cash');DB.d.shift={name:document.getElementById('shn').value,user:App.userName(),start:Date.now(),float:f};DB.save();App.closeModal();App.log('shift','Shift opened: '+DB.d.shift.name);App.toast('Shift opened');App.render()},
expected(){const D=DB.d,s=D.shift;return r3(s.float+D.sales.filter(x=>x.time>=s.start).reduce((a,x)=>a+x.pays.filter(p=>p.type==='cash').reduce((b,p)=>b+p.amt,0),0))},
closeAsk(){if(!App.can('shift'))return App.toast('Your role cannot open or close shifts');const D=DB.d;if(!D.shift)return;if(D.tables.some(t=>t.status!=='free'))return App.toast('Settle or void all open tables before closing the shift');App.modal(`<h3 style="margin-top:0">Close shift</h3><p>Expected cash in drawer: <b>${D.settings.currency} ${App.money(this.expected())}</b></p><label class="fld"><span>Counted cash</span><input type="text" id="shc"></label><div class="row"><button style="background:var(--red)" onclick="Shifts.doClose()">Close shift</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
doClose(){const D=DB.d,s=D.shift,c=parseFloat(document.getElementById('shc').value);if(isNaN(c)||c<0)return App.toast('Enter the counted cash');const e=this.expected(),end=Date.now(),mine=D.sales.filter(x=>x.time>=s.start);
D.shiftLog.unshift({name:s.name,user:s.user,start:s.start,end,float:s.float,expected:e,counted:c,variance:r3(c-e),bills:mine.length,total:mine.reduce((a,x)=>a+x.total,0)});App.log('shift','Shift closed: '+s.name+' (variance '+App.money(r3(c-e))+')');D.shift=null;DB.save();App.closeModal();App.toast('Shift closed. Variance '+App.money(r3(c-e)));App.render()}};
const Setup={lid:null,mc:'all',colors:['teal','pink','red','orange','grey','purple','blue'],

dining:'<svg width="72" height="64" viewBox="0 0 72 64" fill="#444"><path d="M26 18a10 10 0 0 1 20 0z"/><rect x="34" y="6" width="4" height="4"/><rect x="18" y="19" width="36" height="3"/><rect x="34" y="22" width="4" height="30"/><rect x="26" y="50" width="20" height="4" rx="2"/><path d="M4 26h12v12H4zM4 38h4v22H4zM12 38h4v22h-4zM56 26h12v12H56zM56 38h4v22h-4zM64 38h4v22h-4z"/></svg>',

pin:'<svg width="48" height="56" viewBox="0 0 48 56"><path d="M24 2C14 2 7 9.5 7 19c0 12 17 33 17 33s17-21 17-33C41 9.5 34 2 24 2z" fill="#444"/><circle cx="24" cy="19" r="7" fill="#fff"/></svg>',
monitor:'<svg width="64" height="56" viewBox="0 0 64 56"><rect x="3" y="3" width="58" height="38" rx="3" fill="none" stroke="#444" stroke-width="5"/><rect x="29" y="41" width="6" height="8" fill="#444"/><rect x="16" y="49" width="32" height="5" rx="2" fill="#444"/></svg>',
card:'<svg width="64" height="48" viewBox="0 0 64 48"><rect x="2" y="4" width="60" height="40" rx="5" fill="#444"/><rect x="2" y="12" width="60" height="8" fill="#fff"/><rect x="8" y="30" width="16" height="6" rx="2" fill="#fff"/></svg>',

crumb(p){return `<div class="crumbs"><a href="#/setup">&#8962; Setup</a>${p.map(([l,h])=>`<span>&rsaquo;</span>${h?`<a href="${h}">${App.esc(l)}</a>`:`<b>${App.esc(l)}</b>`}`).join('')}</div>`},
L(id){return DB.d.locations.find(l=>l.id===id)},
f:(l,h)=>`<label class="fld"><span>${l}</span>${h}</label>`,
tx(path,v,k,w){return `<input type="text" value="${App.esc(v)}" onchange="Setup.setL('${path}',this.value${k?",'n'":''})"${w?` style="width:${w}"`:''}>`},
chk(path,label,v){return `<label class="prow"><span>${label}</span><input type="checkbox" ${v?'checked':''} onchange="Setup.setL('${path}',this.checked)" style="width:22px;height:22px"></label>`},
tile(h,i,l,beta,cls){return `<a class="stile${cls?' '+cls:''}" href="${h}">${beta?'<span class="ribbon">BETA</span>':''}${i}<span>${l}</span></a>`},
render(a,b,c,d){if(!App.isMgr())return '<div class="pagew"><div class="card">Setup needs Owner or Manager access. <a href="#/dine-in">Back</a></div></div>';
if(a==='locations')return this.locations();if(a==='loc')return this.edit(b,c,d);if(a==='global')return Global.render(b);if(a==='payments')return Global.render('payments');
if(a==='help')return `${this.crumb([['Help Links']])}<div class="pagew"><h1 class="h1">Help Links</h1><hr class="hr">${this.p_help()}</div>`;
return `${this.crumb([])}<div class="pagew"><h1 class="h1">${App.t('Setup')}</h1><hr class="hr"><div class="tiles">${this.tile('#/setup/locations',this.ico.pin,'Locations')}${this.tile('#/setup/global',this.ico.cog,'Global Settings')}${this.tile('#/setup/help',this.ico.video,'Help Links')}</div></div>`},
locations(){const D=DB.d;return `${this.crumb([['Locations']])}<div class="pagew"><div class="row"><h1 class="h1">Locations</h1><button class="btng" style="margin-inline-start:auto" onclick="Setup.addLocAsk()">+ Add Location</button></div><hr class="hr"><div class="row" style="align-items:flex-start;gap:30px">${D.locations.map(l=>`<a class="lcard" href="#/setup/loc/${l.id}"><h2>${App.esc(l.name)}</h2><div>${App.esc(l.addr1)}${l.addr2?' '+App.esc(l.addr2):''}<br>${App.esc(l.city)}${l.state?', '+App.esc(l.state):''}, ${App.esc(l.country)}</div>${l.id===D.loc?'<span class="act">Active in POS</span>':''}<span class="ph">&#9742; ${App.esc(App.phone(l.phone))}</span></a>`).join('')}</div></div>`},
addLocAsk(){App.modal(`<h3 style="margin-top:0">Add Location</h3><label class="fld"><span>Name</span><input type="text" id="ln"></label><label class="fld"><span>Address</span><input type="text" id="l1"></label><label class="fld"><span>City</span><input type="text" id="l2"></label><label class="fld"><span>Phone</span><input type="text" id="lp2"></label><div class="row"><button style="background:var(--green)" onclick="Setup.addLoc()">Create</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
addLoc(){const n=document.getElementById('ln').value.trim();if(!n)return App.toast('Enter a name');const l=DB.newLoc(n,document.getElementById('l1').value,document.getElementById('l2').value,document.getElementById('lp2').value);DB.d.locations.push(l);DB.save();App.closeModal();App.go('#/setup/loc/'+l.id)},
delLoc(id){const D=DB.d;if(id===D.loc||D.locations.length<2)return App.toast('The active location cannot be deleted');D.locations=D.locations.filter(l=>l.id!==id);delete D.locData[id];D.users.forEach(u=>{u.locs=(u.locs||[]).filter(x=>x!==id);if(u.defLoc===id)u.defLoc=u.locs[0]||''});DB.save();App.go('#/setup/locations')},
switchTo(id){DB.switchLoc(id);App.toast('POS now runs '+this.L(id).name);App.render()},
edit(id,sec,sub){const l=this.L(id);if(!l)return this.locations();this.lid=id;const D=DB.d,S=this.SEC,I=this.ico;
if(sec&&S[sec]){const SB=(this.SUBS||{})[sec];let title=S[sec],cr=[['Locations','#/setup/locations'],[l.name,'#/setup/loc/'+id]],back='#/setup/loc/'+id,body;
if(SB&&sub&&SB[sub]){if(sec==='menu')cr.push([S.menu,'#/setup/loc/'+id+'/menu']);cr.push([SB[sub]]);title=SB[sub];back='#/setup/loc/'+id+'/'+sec;body=this[(sec==='menu'?'m_':'d_')+sub](l)}else{cr.push([S[sec]]);body=this['s_'+sec](l)}
return `${this.crumb(cr)}<div class="pagew"><div class="row"><a href="${back}" class="back" aria-label="Back">&larr;</a><h1 class="h2">${title}</h1>${this.trash?`<button style="margin-inline-start:auto;background:#555" onclick="Setup.undo()">&#8630; Undo: removed ${App.esc(this.trash.label)}</button>`:''}</div><hr class="hr">${body}</div>`}
const T=[['general',I.building],['shifts',I.shifts,1],['menu',I.gears],['staff',I.staff],['dining',I.dining],['printers',I.puzzle],['delivery',I.pin],['self',I.monitor]];
return `${this.crumb([['Locations','#/setup/locations'],[l.name]])}<div class="pagew"><div class="row"><a href="#/setup/locations" class="back" aria-label="Back">&larr;</a><h1 class="h2">Edit Location</h1>${l.id===D.loc?'<span class="act" style="margin-inline-start:auto">Active in POS</span>':`<button style="margin-inline-start:auto;background:var(--blue)" onclick="Setup.switchTo('${id}')">Use this location in POS</button>`}</div><hr class="hr"><div class="tiles">${T.map(([k,i,b])=>this.tile('#/setup/loc/'+id+'/'+k,i,S[k],b)).join('')}</div></div>`},
setL(path,v,k){const p=path.split('.');let o=this.L(this.lid);for(let i=0;i<p.length-1;i++)o=o[p[i]];let x=v;if(k==='n'){x=parseFloat(v);if(isNaN(x)||x<0)return App.toast('Enter a valid number')}o[p[p.length-1]]=x;DB.save();App.toast('Saved')},
set(path,v,k){const p=path.split('.');let o=DB.d;for(let i=0;i<p.length-1;i++)o=o[p[i]];let x=v;if(k==='n'||k==='pct'){x=parseFloat(v);if(isNaN(x)||x<0)return App.toast('Enter a valid number');if(k==='pct')x=x/100}if(path==='settings.decimals')x=Math.min(3,Math.round(x));o[p[p.length-1]]=x;DB.save();App.toast('Saved')},
notActive(l){return `<div class="note">This area works on the active location. <button style="background:var(--blue)" onclick="Setup.switchTo('${l.id}')">Use ${App.esc(l.name)} in POS</button></div>`},
s_general(l){const s=DB.d.settings,CN={OMR:'Omani Rial',USD:'US Dollar',EUR:'Euro',GBP:'British Pound',AED:'UAE Dirham',SAR:'Saudi Riyal',QAR:'Qatari Riyal',KWD:'Kuwaiti Dinar',BHD:'Bahraini Dinar',INR:'Indian Rupee',PKR:'Pakistani Rupee'},
row=(lb,h,req)=>`<div class="frow"><label>${lb}</label><div>${req?'<small class="req">* REQUIRED</small>':''}${h}</div></div>`,inp=(id,v)=>`<input type="text" id="lf_${id}" value="${App.esc(v||'')}">`,g=(p,v,k)=>`<input type="text" value="${App.esc(v)}" onchange="Setup.set('${p}',this.value${k?`,'${k}'`:''})">`;
return `<div class="geo"><div class="gform">${row('Name',inp('name',l.name),1)}${row('Address',inp('addr1',l.addr1))}${row('Address 2',inp('addr2',l.addr2))}${row('City',inp('city',l.city),1)}${row('State',inp('state',l.state))}${row('Country',`<span class="st">${App.esc(l.country)}</span>`)}${row('Postal Code',inp('postal',l.postal))}${row('Time zone',`<span class="st">${App.esc((l.tz||'').split('/').pop().replace(/_/g,' '))}</span>`)}${row('Currency',`<span class="st">${App.esc((CN[s.currency]||s.currency)+' - '+s.currency)}</span>`)}${row('Telephone',inp('phone',l.phone))}<div class="frow"><label></label><div><button class="btng" onclick="Setup.saveLoc()">&#10003; Update</button></div></div></div>
<div class="gmap"><div style="margin-bottom:8px">Store Location:</div>${MapView.html(l)}</div></div>
<hr class="hr"><div class="two"><div><h3 style="margin-top:0">Receipt and contact details</h3>${this.f('Email',this.tx('email',l.email))}${this.f('Tax registration number (printed on receipts)',this.tx('taxId',l.taxId))}${this.f('Country',this.tx('country',l.country))}${this.f('Time zone (for example Asia/Muscat)',this.tx('tz',l.tz))}</div>
<div><h3 style="margin-top:0">Business (all locations)</h3>${this.f('Business name',g('settings.name',s.name))}${this.f('Receipt footer message',g('settings.foot',s.foot||''))}<p style="color:#666">The supervisor password is managed in <a href="#/setup/global/supervisor">Global Settings, Supervisor Password</a>.</p>${this.f('Currency code',g('settings.currency',s.currency))}${this.f('Decimals (0 to 3)',g('settings.decimals',s.decimals,'n'))}<p style="color:#666">Tax rates are managed in <a href="#/setup/loc/${l.id}/menu/taxes">Menu Management, Tax Rates</a>.</p></div></div>
${DB.d.locations.length>1&&l.id!==DB.d.loc?`<p><button style="background:var(--red)" onclick="Setup.delLoc('${l.id}')">Delete this location</button></p>`:''}`},
after(a,b,c){if(a==='loc'&&c==='general'&&this.L(b))MapView.mount(this.L(b));if(a==='loc'&&c==='staff')this.staffFilter()},

addRole(){const n=document.getElementById('rn1').value.trim();if(!this.roleOk(n))return App.toast(n?'That role already exists':'Enter a role name');DB.d.roles.push({name:n,perms:{orders:true,discount:false,void:false,pay:false,shift:false,reports:false,setup:false}});this.srole=n;DB.save();App.closeModal();App.render()},
renameRoleAsk(){const R=this.srole;if(R==='Admin')return App.toast('The Admin role cannot be renamed');App.modal(`<h3 style="margin-top:0">Rename role</h3><label class="fld"><span>Role name</span><input type="text" id="rn1" value="${App.esc(R)}"></label><div class="row"><button style="background:var(--green)" onclick="Setup.renameRole()">Save</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
renameRole(){const o=this.srole,n=document.getElementById('rn1').value.trim();if(!this.roleOk(n,o))return App.toast(n?'That role already exists':'Enter a role name');DB.d.roles.find(r=>r.name===o).name=n;DB.d.users.forEach(u=>{if(u.role===o)u.role=n});this.srole=n;DB.save();App.closeModal();App.render()},
delRole(){const R=this.srole,D=DB.d;if(R==='Admin')return App.toast('The Admin role cannot be deleted');if(D.users.some(u=>u.role===R))return App.toast('Move or remove the staff in this role first');D.roles=D.roles.filter(r=>r.name!==R);this.srole=null;DB.save();App.render()},
setPerm(i,k,on){DB.d.roles[i].perms[k]=on;const u=App.user();if(u&&!App.can('setup')){DB.d.roles[i].perms[k]=true;App.toast('That would lock you out of Setup');return App.render()}DB.save();App.toast('Saved')},
s_printers(l){const P=l.periph;return `<h3 style="margin-top:0">Printers</h3><p style="color:#666">A kitchen ticket goes to the printer whose stations match the item's station.</p>${l.printers.map((p,i)=>`<div class="prow" style="flex-wrap:wrap;gap:8px"><input type="text" value="${App.esc(p.name)}" style="max-width:170px" onchange="Setup.setL('printers.${i}.name',this.value)"><select onchange="Setup.setL('printers.${i}.type',this.value)">${['Receipt','Kitchen'].map(t=>`<option${t===p.type?' selected':''}>${t}</option>`).join('')}</select><select onchange="Setup.setL('printers.${i}.conn',this.value)">${['Network','USB','Bluetooth'].map(t=>`<option${t===p.conn?' selected':''}>${t}</option>`).join('')}</select><input type="text" value="${App.esc(p.addr)}" placeholder="IP address" style="max-width:140px" onchange="Setup.setL('printers.${i}.addr',this.value)"><input type="text" value="${App.esc(p.stations)}" placeholder="Stations" style="max-width:240px" onchange="Setup.setL('printers.${i}.stations',this.value)"><button style="background:#555" onclick="Setup.testPrint(${i})">Test print</button><button style="background:var(--red)" onclick="Setup.delPrinter(${i})">Delete</button></div>`).join('')}<div class="row" style="margin:12px 0 24px"><input type="text" id="pn" placeholder="New printer name" style="max-width:240px"><button style="background:var(--green)" onclick="Setup.addPrinter()">+ Add printer</button></div>
<h3>Peripherals and printing</h3>${this.chk('periph.openDrawer','Open the cash drawer on cash payments',P.openDrawer)}${this.chk('periph.scanner','Barcode scanner: add an item when its barcode is scanned into search',P.scanner)}${this.chk('periph.autoPrintKitchen','Open the print dialog automatically when an order is sent',P.autoPrintKitchen)}${this.chk('periph.kds','Kitchen display screens (Phase 2)',P.kds)}${this.chk('periph.customerDisplay','Customer-facing display (Phase 3)',P.customerDisplay)}
<label class="prow"><span>Paper width</span><select onchange="Setup.setL('periph.paper',this.value);App.render()">${['58mm','80mm'].map(t=>`<option${t===P.paper?' selected':''}>${t}</option>`).join('')}</select></label>`},
addPrinter(){const n=document.getElementById('pn').value.trim();if(!n)return App.toast('Enter a printer name');this.L(this.lid).printers.push({name:n,type:'Kitchen',conn:'Network',addr:'',stations:'All'});DB.save();App.render()},
delPrinter(i){this.L(this.lid).printers.splice(i,1);DB.save();App.render()},
testPrint(i){const l=this.L(this.lid),p=l.printers[i];App.modal(`<div class="mono">TEST PRINT\n${App.esc(p.name)}\n${p.type} printer, ${p.conn}${p.addr?' '+App.esc(p.addr):''}\nPaper ${l.periph.paper}\nStations: ${App.esc(p.stations)}\n\nIf this prints correctly the printer is ready.</div><div class="row noprint" style="margin-top:14px"><button style="background:#222" onclick="window.print()">Print</button><button style="background:#888" onclick="App.closeModal()">Close</button></div>`)},
s_delivery(l){const d=l.delivery;return `<div class="two"><div>${this.chk('delivery.enabled','Offer delivery',d.enabled)}${this.chk('delivery.accepting','Accepting delivery orders right now',d.accepting)}${this.f('Minimum order amount',this.tx('delivery.minOrder',d.minOrder,'n','140px'))}${this.f('Delivery fee',this.tx('delivery.fee',d.fee,'n','140px'))}${this.f('Free delivery above',this.tx('delivery.freeAbove',d.freeAbove,'n','140px'))}${this.f('Estimated time (minutes)',this.tx('delivery.eta',d.eta,'n','140px'))}</div>
<div><h3 style="margin-top:0">Delivery zones</h3>${d.zones.map((z,i)=>`<div class="prow"><input type="text" value="${App.esc(z.name)}" style="max-width:200px" onchange="Setup.setL('delivery.zones.${i}.name',this.value)"><span>Fee <input type="text" value="${z.fee}" style="width:80px" onchange="Setup.setL('delivery.zones.${i}.fee',this.value,'n')"></span><button style="background:var(--red)" onclick="Setup.delZone(${i})">Delete</button></div>`).join('')}<div class="row" style="margin-top:12px"><input type="text" id="zn" placeholder="Zone name" style="max-width:200px"><button style="background:var(--green)" onclick="Setup.addZone()">+ Add zone</button></div><p style="color:#777;margin-top:18px">These settings are saved now. The Delivery Manager screen will use them when we build it.</p></div></div>`},
addZone(){const n=document.getElementById('zn').value.trim();if(!n)return App.toast('Enter a zone name');this.L(this.lid).delivery.zones.push({name:n,fee:1});DB.save();App.render()},
delZone(i){this.L(this.lid).delivery.zones.splice(i,1);DB.save();App.render()},
s_self(l){const s=l.selfOrder,D=DB.d,base=(s.baseUrl||'https://your-site.example').replace(/\/$/,'');return `<div class="two"><div>${this.chk('selfOrder.qr','QR ordering at the table',s.qr)}${this.chk('selfOrder.kiosk','Self-order kiosk',s.kiosk)}${this.chk('selfOrder.payAtTable','Allow payment at the table',s.payAtTable)}${this.chk('selfOrder.approve','Staff approve self-orders before they reach the kitchen',s.approve)}${this.f('Customer ordering website address',this.tx('selfOrder.baseUrl',s.baseUrl))}${this.f('Welcome message',this.tx('selfOrder.welcome',s.welcome))}</div>
<div><h3 style="margin-top:0">Table links</h3>${l.id===D.loc?`<div class="mono" style="max-height:300px;overflow:auto;background:#f6f6f6;padding:10px;border-radius:4px">${D.tables.map(t=>App.esc(QRM.url(l.id,t.n))).join('\n')}</div>`:this.notActive(l)}<p style="color:#777;margin-top:14px">Each table has its own link. Open Menu Management, QR Menu to print the QR codes and preview the customer page.</p></div></div>`},
p_payments(){const D=DB.d;return `${D.methods.map((m,i)=>`<div class="prow"><input type="text" value="${App.esc(m.name)}" style="max-width:260px" onchange="Setup.set('methods.${i}.name',this.value)"><span>${m.type}${m.type==='account'?' &middot; balance '+App.money(DB.bal(m.id)):''}</span>${m.id==='cash'?'<span></span>':`<button style="background:var(--red)" onclick="Setup.delMethod(${i})">Delete</button>`}</div>`).join('')}<div class="row" style="margin-top:12px"><input type="text" id="nm" placeholder="Name" style="max-width:240px"><select class="f" id="nmt"><option value="card">Card</option><option value="account">Customer account</option></select><button style="background:var(--green)" onclick="Setup.addMethod()">+ Add</button></div>`},
addMethod(){const n=document.getElementById('nm').value.trim();if(!n)return App.toast('Enter a name');DB.d.methods.push({id:'m'+Date.now(),name:n,type:document.getElementById('nmt').value});DB.save();App.render()},
delMethod(i){const m=DB.d.methods[i];if(m.type==='account'&&Math.abs(DB.bal(m.id))>0.0005)return App.toast('This account still has a balance');DB.d.methods.splice(i,1);DB.save();App.render()},
p_help(){const H=DB.d.help;return `<p style="color:#666">Paste a web link for each tutorial. It appears on the Video Tutorials page.</p>${TUT.map(([k,l])=>this.f(l,`<input type="text" value="${App.esc(H[k]||'')}" placeholder="https://" onchange="Setup.set('help.${k}',this.value)">`)).join('')}`}};
Object.assign(Setup.ico,{percent:'<svg width="60" height="60" viewBox="0 0 60 60" fill="currentColor"><circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="44" cy="44" r="9" fill="none" stroke="currentColor" stroke-width="7"/><path d="M46 4l9 6L14 56 5 50z"/></svg>',
calc:'<svg width="52" height="56" viewBox="0 0 52 56" fill="currentColor"><path fill-rule="evenodd" d="M5 1h42a4 4 0 0 1 4 4v46a4 4 0 0 1-4 4H5a4 4 0 0 1-4-4V5a4 4 0 0 1 4-4zM7 8v8h38V8z'+[0,1,2,3].map(r=>[0,1,2,3].map(c=>`M${10+c*10.5} ${22+r*8.5}a3 3 0 1 0 .01 0z`).join('')).join('')+'"/></svg>',
utensils:'<svg width="46" height="56" viewBox="0 0 46 56" fill="currentColor"><path d="M2 2h4v14h3V2h4v14h3V2h4v18a7 7 0 0 1-6 7v27h-6V27A7 7 0 0 1 2 20z"/><path d="M30 2c7 0 13 8 13 22 0 4-2 6-6 6v24h-7z"/></svg>'});
Setup.SUBS={menu:Setup.SUB,dining:{}};
App.register('setup',Setup);
</script><script>/* Floor plan: live view on the Dine-In screen and a drag-and-drop editor in Setup. */
const Floor={sel:null,snap:true,cur:null,
pos(ts){const cols=Math.max(1,Math.ceil(Math.sqrt(ts.length*1.6))),rows=Math.max(1,Math.ceil(ts.length/cols));return ts.map((t,i)=>({t,x:t.x!=null?t.x:10+(i%cols)*(80/cols)+40/cols,y:t.y!=null?t.y:12+Math.floor(i/cols)*(76/rows)+38/rows}))},
clamp(x,y){x=Math.max(5,Math.min(95,x));y=Math.max(6,Math.min(94,y));if(this.snap){x=Math.round(x/2.5)*2.5;y=Math.round(y/2.5)*2.5}return{x,y}},
planHtml(area,mode){const D=DB.d,e=App.esc,col={free:'#5cb85c',occ:'#6b6b6b',soon:'#e07b00'},lab={free:'Available',occ:'Occupied',soon:'Done Soon'},ed=mode==='edit';
return `<div class="plan${ed?' edit':''}" id="plan">${this.pos(D.tables.filter(t=>t.area===area)).map(({t,x,y})=>`<div class="pt ${t.shape||'square'}${ed&&this.sel===t.n?' sel':''}" data-n="${t.n}" style="left:${x}%;top:${y}%;background:${ed?'#6c8ebf':col[t.status]}" ${ed?`onpointerdown="Floor.down(event,${t.n})"`:`onclick="App.go('#/order/${t.n}')"`}><b>${e(t.name)}</b><small>${t.seats||4} seats${ed?'':' &middot; '+App.t(lab[t.status])}</small></div>`).join('')}</div>`},
tbl(n){return DB.d.tables.find(t=>t.n===n)},
down(ev,n){ev.preventDefault();this.sel=n;const pl=document.getElementById('plan'),el=ev.currentTarget,r=pl.getBoundingClientRect();try{el.setPointerCapture(ev.pointerId)}catch(x){}
const mv=m=>{const c=this.clamp((m.clientX-r.left)/r.width*100,(m.clientY-r.top)/r.height*100);el.style.left=c.x+'%';el.style.top=c.y+'%';this.cur={n,x:c.x,y:c.y}};
const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);if(this.cur){this.move(this.cur.n,this.cur.x,this.cur.y);this.cur=null}this.refresh()};el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);this.refresh()},
move(n,x,y){const t=this.tbl(n),c=this.clamp(x,y);t.x=c.x;t.y=c.y;DB.save()},
refresh(){const pl=document.getElementById('plan');if(!pl)return;const a=this.tbl(this.sel)?this.tbl(this.sel).area:Setup.sarea;pl.outerHTML=this.planHtml(Setup.sarea,'edit');const p=document.getElementById('fpanel');if(p)p.innerHTML=this.panelHtml()},
panelHtml(){const t=this.sel!=null?this.tbl(this.sel):null,e=App.esc;if(!t)return '<p style="color:#777">Tap a table to edit it.</p>';
return `<b>Table ${e(t.name)}</b><label class="fld" style="margin-top:12px"><span>Name</span><input type="text" id="fn" value="${e(t.name)}" onchange="Floor.upd('name',this.value)"></label><label class="fld"><span>Seats</span><input type="text" value="${t.seats||4}" onchange="Floor.upd('seats',this.value)"></label><label class="fld"><span>Shape</span><select class="f" onchange="Floor.upd('shape',this.value)">${['square','round','wide'].map(s=>`<option${s===(t.shape||'square')?' selected':''}>${s}</option>`).join('')}</select></label>`},
upd(k,v){const t=this.tbl(this.sel);if(!t)return;if(k==='name'){v=v.trim();if(!v||DB.d.tables.some(x=>x.n!==t.n&&x.name.toLowerCase()===v.toLowerCase())){App.toast(v?'That table name is already used':'Enter a name');return this.refresh()}}
if(k==='seats'){v=Math.round(parseFloat(v));if(!(v>=1&&v<=99)){App.toast('Seats must be 1 to 99');return this.refresh()}}t[k]=v;DB.save();App.toast('Saved');this.refresh()},
auto(){DB.d.tables.filter(t=>t.area===Setup.sarea).forEach(t=>{delete t.x;delete t.y});DB.save();App.toast('Tables arranged');this.refresh()},
setSnap(v){this.snap=v}};
</script><script>/* Setup > Dining Settings: Dining Sections (tables per section), Floor Plan editor, Order Defaults. */
Object.assign(Setup,{sarea:null,dr:null,drArea:null,drDirty:false,
s_dining(l){const I=this.ico,u=`#/setup/loc/${l.id}/dining/`;return `<div class="tiles t3">${this.tile(u+'sections',I.grid,'Dining Sections')}${this.tile(u+'floor',I.plan,'Floor Plan')}${this.tile(u+'defaults',I.sliders,'Order Defaults')}</div>`},
d_defaults(l){return `<div class="two"><div>${this.f('Default covers for a new order',this.tx('dining.defaultCovers',l.dining.defaultCovers,'n','120px'))}${this.f('Mark a table Done Soon automatically after (minutes, 0 = off)',this.tx('dining.autoSoon',l.dining.autoSoon||0,'n','120px'))}</div><div><p style="color:#666">Surcharges such as service charge are in <a href="#/setup/loc/${l.id}/menu/surcharges">Menu Management, Surcharges and Discounts</a>.</p></div></div>`},
loadDraft(){const D=DB.d;this.drArea=this.sarea;this.dr=D.tables.filter(t=>t.area===this.sarea).map(t=>({id:t.n,name:t.name,seats:t.seats||4,del:false}));this.drDirty=false},
d_sections(l){const D=DB.d,e=App.esc;if(l.id!==D.loc)return this.notActive(l);if(!D.areas.includes(this.sarea))this.sarea=D.areas[0];if(!this.dr||this.drArea!==this.sarea)this.loadDraft();const a=this.sarea;
const tabs=D.areas.map((x,i)=>`<a class="rtab${x===a?' on':''}" href="javascript:Setup.pickSection(${i})">${e(x)}<small>${D.tables.filter(t=>t.area===x).length}</small></a>`).join('');
return `<div class="row" style="align-items:flex-start;gap:0;flex-wrap:nowrap"><div class="rtabs"><div>${tabs}</div><div style="padding:14px 18px"><button class="pbtn" onclick="Setup.addSecAsk()">+ Add section</button></div></div>
<div style="flex:1;padding-inline-start:26px;min-width:0"><div class="row"><h2 class="sech">${e(a)}</h2><button class="editbtn" aria-label="Rename section" onclick="Setup.renSecAsk()">&#9998;</button><span style="margin-inline-start:auto" class="row"><button class="pbtn" aria-label="Move section up" onclick="Setup.moveSec(-1)">&uarr;</button><button class="pbtn" aria-label="Move section down" onclick="Setup.moveSec(1)">&darr;</button><button style="background:#2b2b2b" onclick="Setup.floorFor()">Setup Floor Plan</button></span></div>
<div class="row" style="margin:10px 0 0"><label style="color:#555">Building or floor</label><input type="text" value="${e(((DB.d.areaMeta||{})[DB.d.loc+'|'+a]||{}).b||'')}" placeholder="e.g. Main building" style="max-width:240px;padding:8px;border:1px solid #ccd;border-radius:4px" onchange="Setup.setBuilding(this.value)"></div><div class="thead"><span>Table Name</span><span>Seats</span></div><div id="trows">${this.rowsHtml()}</div><hr style="border:0;border-top:1px dotted #aaa;margin:26px 0">
<div class="row"><button class="btnr" onclick="Setup.rmSecAsk()"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M6 6h12l-1 15H7zM9 2h6l1 2h5v2H3V4h5z"/></svg> Remove ${e(a)}</button><span style="margin-inline-start:auto" class="row"><span id="unsaved" style="color:#e07b00;display:${this.drDirty?'':'none'}">Unsaved changes</span>
<span class="split-btn"><button class="b" onclick="Setup.addRows(1)">+ Add Table</button><button class="b caret" aria-label="More ways to add tables" onclick="Setup.toggleAdd()">&#9650;</button><div id="addmenu" hidden><a href="javascript:Setup.addRows(5)">Add 5 tables</a><a href="javascript:Setup.addRows(10)">Add 10 tables</a><a href="javascript:Setup.addRowsAsk()">Add a number of tables...</a></div></span>
<button class="btns" onclick="Setup.saveAll()"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M3 3h14l4 4v14H3zM7 3v6h9V3zM7 14h10v7H7z"/></svg> Save All</button></span></div></div></div>`},
rowsHtml(){const e=App.esc,rows=this.dr.map((r,i)=>r.del?'':`<div class="trow"><input type="text" value="${e(r.name)}" id="tn${i}" oninput="Setup.drSet(${i},'name',this.value)" aria-label="Table name"><input type="number" min="1" max="99" value="${r.seats}" class="seat" oninput="Setup.drSet(${i},'seats',this.value)" aria-label="Seats"><button class="x" aria-label="Remove table" onclick="Setup.drDel(${i})">&times;</button></div>`).join('');return rows||'<p style="color:#777;padding:14px">No tables in this section yet. Press + Add Table.</p>'},
dirty(on){this.drDirty=on;const u=document.getElementById('unsaved');if(u)u.style.display=on?'':'none'},
drSet(i,k,v){this.dr[i][k]=k==='seats'?v:v;this.dirty(true);const el=document.getElementById('tn'+i);if(el)el.classList.remove('bad')},
drDel(i){const r=this.dr[i],t=r.id!=null?DB.d.tables.find(x=>x.n===r.id):null;if(t&&t.status!=='free')return App.toast('Table '+r.name+' has an open order. Settle or void it first');if(r.id==null)this.dr.splice(i,1);else r.del=true;this.dirty(true);document.getElementById('trows').innerHTML=this.rowsHtml()},
toggleAdd(){const m=document.getElementById('addmenu');m.hidden=!m.hidden},
nextNames(n){const used=new Set(DB.d.tables.map(t=>t.name.toLowerCase()));this.dr.forEach(r=>used.add(String(r.name).toLowerCase()));let k=Math.max(0,...[...used].map(x=>/^\d+$/.test(x)?+x:0))+1;const out=[];while(out.length<n){if(!used.has(String(k))){out.push(String(k));used.add(String(k))}k++}return out},
addRows(n){const m=document.getElementById('addmenu');if(m)m.hidden=true;n=Math.max(1,Math.min(100,n));this.nextNames(n).forEach(x=>this.dr.push({id:null,name:x,seats:4,del:false}));this.dirty(true);const c=document.getElementById('trows');c.innerHTML=this.rowsHtml();const last=[...c.querySelectorAll('input[type=text]')].pop();if(last){last.focus();last.scrollIntoView&&last.scrollIntoView({block:'nearest'})}},
addRowsAsk(){const m=document.getElementById('addmenu');if(m)m.hidden=true;App.modal(`<h3 style="margin-top:0">Add tables</h3><label class="fld"><span>How many tables? (1 to 100)</span><input type="text" id="ar1" value="5"></label><div class="row"><button style="background:var(--green)" onclick="Setup.addRowsGo()">Add</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
addRowsGo(){const n=parseInt(document.getElementById('ar1').value);if(!(n>=1&&n<=100))return App.toast('Enter a number from 1 to 100');App.closeModal();this.addRows(n)},
saveAll(then){const D=DB.d,rows=this.dr,seen=new Set(),other=new Set(D.tables.filter(t=>t.area!==this.sarea).map(t=>t.name.toLowerCase()));let bad=null;
rows.forEach((r,i)=>{if(r.del||bad)return;const nm=String(r.name).trim().toLowerCase(),s=Math.round(parseFloat(r.seats));if(!nm)bad=[i,'Every table needs a name'];else if(seen.has(nm)||other.has(nm))bad=[i,'The name "'+r.name+'" is already used'];else if(!(s>=1&&s<=99))bad=[i,'Seats must be 1 to 99'];seen.add(nm)});
if(bad){const el=document.getElementById('tn'+bad[0]);if(el){el.classList.add('bad');el.focus()}return App.toast(bad[1])}
for(const r of rows){if(r.del&&r.id!=null){const t=D.tables.find(x=>x.n===r.id);if(t&&t.status!=='free')return App.toast('Table '+t.name+' has an open order. Settle or void it first')}}
let nextN=Math.max(0,...D.tables.map(t=>t.n));rows.forEach(r=>{const nm=String(r.name).trim(),s=Math.round(parseFloat(r.seats));if(r.del){if(r.id!=null){D.tables=D.tables.filter(t=>t.n!==r.id);delete D.orders[r.id]}}else if(r.id==null){D.tables.push({n:++nextN,area:this.sarea,status:'free',name:nm,seats:s,shape:'square'})}else{const t=D.tables.find(x=>x.n===r.id);t.name=nm;t.seats=s}});
D.tables.sort((x,y)=>x.n-y.n);DB.save();this.loadDraft();App.toast('All changes saved');if(typeof then==='function')return then();App.render()},
pickSection(i){const a=DB.d.areas[i];if(a===this.sarea)return;if(!this.drDirty){this.sarea=a;this.loadDraft();return App.render()}
App.modal(`<h3 style="margin-top:0">Unsaved changes</h3><p>Save the changes to ${App.esc(this.sarea)} before you leave?</p><div class="row"><button style="background:var(--green)" onclick="App.closeModal();Setup.saveAll(()=>{Setup.sarea=DB.d.areas[${i}];Setup.loadDraft();App.render()})">Save All</button><button style="background:var(--red)" onclick="App.closeModal();Setup.sarea=DB.d.areas[${i}];Setup.loadDraft();App.render()">Discard</button><button style="background:#888" onclick="App.closeModal()">Stay</button></div>`)},

p_modgroups(nt){const D=DB.d,e=App.esc;const body=D.modGroups.map((g,i)=>this.pn('mg'+i,`<input type="text" value="${e(g.name)}" style="max-width:220px;font-weight:700;padding:8px;border:1px solid #ccd;border-radius:4px" onchange="Global.set('modGroups',${i},'name',this.value,'t')">`,g.mods.length+' modifiers',`<button class="pbtn" style="color:var(--red);font-size:15px" aria-label="Remove group" onclick="Global.rmGroup(${i})">&times;</button>`,

render(a,b,c,d){if(!App.isMgr())return '<div class="pagew"><div class="card">Setup needs Owner or Manager access. <a href="#/dine-in">Back</a></div></div>';

home(){const I=this.ico,T=(h,i,l)=>this.tile(h,i,l,0,'mtile');return `${this.crumb([])}<div class="pagew" style="padding-top:24px">${Co.head()}<div class="tiles t4">${T('#/setup/locations',I.pin,'Location Setup')}${T('#/setup/menu',I.utensils,'Menu Setup')}${T('#/setup/staff',I.people,'Staff')}${T('#/setup/global',I.cog,'Global Settings')}${T('#/setup/partners',I.plug,'Partner Integrations')}${T('#/setup/addons',I.globe,'Add-Ons')}${T('#/setup/account',I.bank,'My Account')}</div></div>`},
page(cr,back,title,body){return `${this.crumb(cr)}<div class="pagew"><div class="row"><a href="${back}" class="back" aria-label="Back">&larr;</a><h1 class="h2">${title}</h1>${this.trash?`<button style="margin-inline-start:auto;background:#555" onclick="Setup.undo()">&#8630; Undo: removed ${App.esc(this.trash.label)}</button>`:''}</div><hr class="hr">${body}</div>`},
