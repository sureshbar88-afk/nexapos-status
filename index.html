after(a,b,c){if(a==='loc'&&c==='general'&&this.L(b))MapView.mount(this.L(b));if((a==='loc'&&c==='staff')||a==='staff')this.staffFilter();if(a==='menu'&&(!b||b==='items'))MenuPage.after()},
account(){const D=DB.d,A=D.account,e=App.esc,kb=Math.round(new Blob([JSON.stringify(D)]).size/1024),inp=(k,l)=>this.f(l,`<input type="text" value="${e(A[k]||'')}" onchange="Setup.set('account.${k}',this.value)">`);
const log=D.audit.slice(0,50).map(a=>`<tr><td>${App.dt(a.t)} ${App.tm(a.t)}</td><td>${e(a.user||'')}</td><td>${a.type==='void'?'Void':a.type==='reprint'?'Bill reprinted':'Changed sent order'}</td><td>#${a.no||''} &middot; Table ${e(DB.tname(a.table))}</td><td>${e(a.reason||'')}</td><td>${a.amount!=null?App.money(a.amount):''}</td></tr>`).join('')||'<tr><td colspan="6" style="color:#777">Nothing recorded yet. Voids and changes to sent orders appear here.</td></tr>';
const body=this.tools()+this.panel('prof','Business profile',4,'',this.f('Business name (shown on receipts)',`<input type="text" value="${e(D.settings.name)}" onchange="Setup.set('settings.name',this.value)">`)+inp('legal','Legal name')+inp('owner','Owner or contact person')+inp('email','Email')+inp('phone','Phone'))+
this.panel('data','Data and backup',3,'',`<p style="color:#666">Your data lives on this device. Make a backup before you clear the browser or change computer.</p><div class="row"><button style="background:var(--blue)" onclick="Account.exp()">Export all data</button><button style="background:#555" onclick="document.getElementById('imf').click()">Import a backup</button><input type="file" id="imf" accept=".json,application/json" hidden onchange="Account.imp(this.files[0])"><button style="background:var(--red)" onclick="Dashboard.ask()">Erase everything</button></div><p style="color:#777;margin-top:12px">Stored on this device: about ${kb} KB.</p>`)+
this.panel('help','Help video links',5,'',this.p_help())+this.panel('log','Activity log',D.audit.length,'',`<div style="overflow:auto"><table><tr><th>When</th><th>Who</th><th>What</th><th>Order</th><th>Reason</th><th>Amount</th></tr>${log}</table></div>`);
return this.page([['My Account']],'#/setup','My Account',body)},
menuSetupDummy:0});
const Account={deliver(name,text,mime){App.modal(`<h3 style="margin-top:0">${App.esc(name)}</h3><textarea id="dlt" readonly style="min-height:200px;font-family:monospace;font-size:12px"></textarea><p style="color:#777;font-size:13px">If the download does not start, copy the text above and save it as ${App.esc(name)}.</p><div class="row"><button style="background:var(--green)" onclick="Account.dl('${App.esc(name)}','${mime}')">Download</button><button style="background:#555" onclick="document.getElementById('dlt').select();document.execCommand('copy');App.toast('Copied')">Copy</button><button style="background:#888" onclick="App.closeModal()">Close</button></div>`);document.getElementById('dlt').value=text;this.txt=text},
async dl(name,mime){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data:new Blob([this.txt],{type:mime})});return App.toast('Saved')}}catch(e){if(e&&e.code==='declined')return}try{const b=new Blob([this.txt],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();App.toast('Download started')}catch(e){App.toast('Copy the text instead')}},
exp(){App.toast('This backup contains PINs and keys. Keep it private.');this.deliver('sandsea-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB.d,null,1),'application/json')},
imp(f){if(!f)return;const r=new FileReader();r.onerror=()=>App.toast('Could not read the file');r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){return App.toast('That file is not a valid backup')}if(!o||!o.locations||!o.users||!o.menu)return App.toast('That file is not a Sand & Sea backup');this.pending=o;
App.modal(`<h3 style="margin-top:0">Replace all data?</h3><p>This backup has ${o.locations.length} location(s), ${o.users.length} staff and ${o.menu.length} menu items. Everything on this device will be replaced.</p><div class="row"><button style="background:var(--red)" onclick="Account.impGo()">Replace</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)};r.readAsText(f)},
impGo(){try{localStorage.setItem(DB.key,JSON.stringify(this.pending))}catch(e){}DB.d=this.pending;DB.save();DB.load();App.closeModal();App.toast('Backup restored');App.go('#/dine-in');App.render()}};
const Partners={cat:'All',
render(){const D=DB.d,cats=['All',...new Set(PARTNERS.map(p=>p.c))],e=App.esc;
return Setup.page([['Partner Integrations']],'#/setup','Partner Integrations',`<div class="row" style="margin-bottom:18px">${cats.map(c=>`<button class="cat${c===this.cat?' on':''}" onclick="Partners.setCat('${c}')">${c}</button>`).join('')}</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${PARTNERS.filter(p=>this.cat==='All'||p.c===this.cat).map(p=>{const s=D.partners[p.id]||{};return `<div class="card"><div class="row"><b>${e(p.n)}</b><span class="pill${p.live?'':' off'}" style="margin-inline-start:auto">${p.live?'Working':'Settings only'}</span></div><small style="color:#777">${p.c}</small><p>${e(p.d)}</p>${p.live?'':'<p style="color:#a60;font-size:13px">The live connection is not built yet. Your details are saved for when it is.</p>'}<div class="row"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:20px;height:20px" ${s.enabled?'checked':''} onchange="Partners.toggle('${p.id}',this.checked)"> Enabled</label><button class="pbtn" style="margin-inline-start:auto;font-size:14px" onclick="Partners.cfg('${p.id}')">Configure</button>${p.id==='csv'?'<button class="pbtn add" onclick="Partners.csvAsk()">Export</button>':''}</div></div>`}).join('')}</div>`)},
setCat(c){this.cat=c;App.render()},
get(id){return DB.d.partners[id]||(DB.d.partners[id]={enabled:false,cfg:{}})},
toggle(id,on){this.get(id).enabled=on;DB.save();App.toast(on?'Enabled':'Disabled')},
cfg(id){const p=PARTNERS.find(x=>x.id===id),s=this.get(id);if(!p.f.length)return App.toast(p.live?'Nothing to configure. Just switch it on.':'');App.modal(`<h3 style="margin-top:0">${App.esc(p.n)}</h3>${p.f.map(([k,l])=>Setup.f(App.esc(l),`<input type="text" id="pf_${k}" value="${App.esc((s.cfg||{})[k]||'')}">`)).join('')}<div class="row"><button style="background:var(--green)" onclick="Partners.save('${id}')">Save</button>${id==='webhook'?'<button style="background:#555" onclick="Partners.test()">Send a test bill</button>':''}<button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
save(id){const p=PARTNERS.find(x=>x.id===id),s=this.get(id);p.f.forEach(([k])=>s.cfg[k]=document.getElementById('pf_'+k).value.trim());if(id==='webhook'&&s.cfg.url&&!/^https:\/\//i.test(s.cfg.url))return App.toast('The address must start with https://');DB.save();App.closeModal();App.toast('Saved')},
payload(sale){const D=DB.d;return {event:'bill.paid',business:D.settings.name,location:DB.loc().name,bill:{no:sale.no,table:DB.tname(sale.table),total:sale.total,currency:D.settings.currency,payments:sale.pays,items:Object.keys(sale.items).map(i=>({name:(DB.item(i)||{}).name,qty:sale.items[i]})),discount:sale.disc,referral:sale.ref,group:sale.group,time:new Date(sale.time).toISOString()}}},
fire(sale){const s=this.get('webhook');if(!s.enabled||!(s.cfg||{}).url)return;try{fetch(s.cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(this.payload(sale))}).catch(()=>{})}catch(e){}},
test(){const u=(document.getElementById('pf_url')||{}).value||this.get('webhook').cfg.url;if(!/^https:\/\//i.test(u||''))return App.toast('Enter an https:// address first');try{fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(this.payload({no:0,table:1,total:1,pays:[],items:{},time:Date.now()}))}).then(()=>App.toast('Test sent. Check the receiving tool.')).catch(()=>App.toast('Could not reach that address'))}catch(e){App.toast('Could not send')}},
waBox(ph){return this.get('whatsapp').enabled?`<div class="row noprint" style="margin-top:12px"><input type="text" id="wap" value="${App.esc(ph||'')}" placeholder="Customer phone, e.g. 96890000000" style="max-width:240px"><button style="background:#25a244" onclick="Partners.waSend()">Send on WhatsApp</button></div>`:''},
waSend(){let n=(document.getElementById('wap').value||'').replace(/\D/g,'');if(n.length<7)return App.toast('Enter the customer phone number');const cc=((this.get('whatsapp').cfg||{}).cc||'968').replace(/\D/g,'');if(n.length<=8)n=cc+n;const t=document.querySelector('#modal .mono').textContent;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank','noopener')},
csvAsk(){App.modal(`<h3 style="margin-top:0">Export bills (CSV)</h3><label class="fld"><span>From date (optional)</span><input type="text" id="cf" placeholder="YYYY-MM-DD"></label><label class="fld"><span>To date (optional)</span><input type="text" id="ct" placeholder="YYYY-MM-DD"></label><div class="row"><button style="background:var(--green)" onclick="Partners.csv()">Create file</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)},
csv(){const D=DB.d,f=document.getElementById('cf').value.trim(),t=document.getElementById('ct').value.trim(),a=f?new Date(f+'T00:00:00').getTime():0,b=t?new Date(t+'T23:59:59').getTime():Infinity;if((f&&isNaN(a))||(t&&isNaN(b)))return App.toast('Use the date format YYYY-MM-DD');
const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=D.sales.filter(s=>s.time>=a&&s.time<=b).map(s=>[new Date(s.time).toISOString().slice(0,10),new Date(s.time).toISOString().slice(11,16),s.no,DB.tname(s.table),s.total.toFixed(3),s.pays.map(p=>p.name+' '+p.amt.toFixed(3)).join('; '),s.disc?s.disc.name+' '+s.disc.pct+'%':'',s.ref||'',s.group||''].map(q).join(','));
App.closeModal();Account.deliver('sandsea-bills.csv',['Date,Time,Bill,Table,Total,Payments,Discount,Referral,Customer group',...rows].join('\n'),'text/csv');App.toast(rows.length+' bill(s) exported')}};
const AddOns={on(id){const D=DB.d;return id==='shifts'?DB.loc().shifts.enabled:id==='ai_suggest'?D.ai.suggest:id==='ai_insights'?D.ai.insights:D.addons[id]!==false},
set(id,v){const D=DB.d;if(id==='shifts')DB.loc().shifts.enabled=v;else if(id==='ai_suggest')D.ai.suggest=v;else if(id==='ai_insights')D.ai.insights=v;else D.addons[id]=v;DB.save();App.toast(v?'Switched on':'Switched off');App.render()},
asked(n){return DB.d.requests.some(r=>r.title==='Add-on: '+n)},
req(id){const n=SOON.find(x=>x[0]===id)[1];if(this.asked(n))return App.toast('Already requested');DB.d.requests.unshift({title:'Add-on: '+n,details:'Requested from Setup, Add-Ons',type:'Feature idea',status:'New',time:Date.now()});DB.save();App.toast('Requested. See Request a feature in the menu.');App.render()},
render(){const e=App.esc;return Setup.page([['Add-Ons']],'#/setup','Add-Ons',`<h3 style="margin-top:0">Included</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${ADDONS.map(([id,n,d])=>`<div class="card"><div class="row"><b>${e(n)}</b><label style="margin-inline-start:auto;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:22px;height:22px" ${this.on(id)?'checked':''} onchange="AddOns.set('${id}',this.checked)"> On</label></div><p style="color:#666">${e(d)}</p></div>`).join('')}</div>
<h3>Coming soon</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${SOON.map(([id,n])=>`<div class="card"><div class="row"><b>${e(n)}</b><span class="pill off" style="margin-inline-start:auto">Not built yet</span></div><div class="row" style="margin-top:12px"><button class="pbtn${this.asked(n)?'':' add'}" style="font-size:14px" ${this.asked(n)?'disabled':''} onclick="AddOns.req('${id}')">${this.asked(n)?'Requested':'Request this'}</button></div></div>`).join('')}</div>`)}};
</script><script>/* Setup > Menu: items with photos, availability, categories, CSV upload/export, menu check, and the Modifiers tab. */
const MenuPage={tab:'items',cat:null,filt:'all',q:'',busy:false,last:null,issues:[],ed:null,plan:null,

photo(f){if(!f)return;if(!/^image\//.test(f.type))return App.toast('Choose an image file');const r=new FileReader();r.onerror=()=>App.toast('Could not read the file');r.onload=()=>{const im=new Image();im.onerror=()=>App.toast('That image could not be opened');im.onload=()=>{let cw=im.width,ch=Math.round(im.width*3/4);if(ch>im.height){ch=im.height;cw=Math.round(im.height*4/3)}const sx=Math.round((im.width-cw)/2),sy=Math.round((im.height-ch)/2),w=Math.min(720,cw),h=Math.round(w*3/4),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,sx,sy,cw,ch,0,0,w,h);this.ed.img=c.toDataURL('image/jpeg',0.82);this.pv()};im.src=r.result};r.readAsDataURL(f)},

if(!n)return App.toast('Enter a name');if(isNaN(p)||p<0)return App.toast('Enter a valid price');if(isNaN(st)||st<0)return App.toast('Enter a valid stock number');if(D.menu.some(x=>x.id!==id&&x.cat===cat&&x.name.toLowerCase()===n.toLowerCase()))return App.toast('That category already has an item with this name');
let m=id?DB.item(id):{id:'i'+Date.now(),code:''};const names={};D.alt.enabled.filter(k=>k!=='en').forEach(k=>{const el=v('me_alt_'+k);if(el&&el.value.trim())names[k]=el.value.trim()});

parse(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','||c===';'){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()!==''))},
csvFile(f){if(!f)return;const r=new FileReader();r.onerror=()=>App.toast('Could not read the file');r.onload=()=>{const rows=this.parse(String(r.result).replace(/^\uFEFF/,''));if(rows.length<2)return App.toast('The file has no items');const H=rows[0].map(h=>h.trim().toLowerCase()),ix=k=>H.indexOf(k);if(ix('name')<0||ix('price')<0)return App.toast('The file needs Name and Price columns');
const D=DB.d,items=[],errs=[];let nu=0,up=0;const newCats=new Set();rows.slice(1).forEach((c,i)=>{const g=k=>ix(k)<0?'':(c[ix(k)]||'').trim(),name=g('name'),price=parseFloat(g('price')),cat=g('category')||'Imported';if(!name){errs.push('Row '+(i+2)+': no name');return}if(isNaN(price)||price<0){errs.push('Row '+(i+2)+': '+name+' has an invalid price');return}
const ci=D.cats.findIndex(x=>x.n.toLowerCase()===cat.toLowerCase());if(ci<0)newCats.add(cat);const ex=ci<0?null:D.menu.find(m=>m.cat===ci&&m.name.toLowerCase()===name.toLowerCase());ex?up++:nu++;items.push({cat,name,price,desc:g('description'),st:g('station'),stock:g('stock'),code:g('barcode')})});
this.plan=items;App.modal(`<h3 style="margin-top:0">Ready to import</h3><p><b>${nu}</b> new item(s), <b>${up}</b> to update, <b>${newCats.size}</b> new categor${newCats.size===1?'y':'ies'}.</p>${errs.length?`<p style="color:var(--red)">${errs.length} row(s) will be skipped:</p><ul style="max-height:25vh;overflow:auto">${errs.slice(0,20).map(x=>'<li>'+App.esc(x)+'</li>').join('')}</ul>`:''}<div class="row"><button style="background:var(--green)" ${items.length?'':'disabled'} onclick="MenuPage.csvGo()">Import</button><button style="background:#888" onclick="App.closeModal()">Cancel</button></div>`)};r.readAsText(f)},
csvGo(){const D=DB.d;let nu=0,up=0;this.plan.forEach(p=>{let ci=D.cats.findIndex(x=>x.n.toLowerCase()===p.cat.toLowerCase());if(ci<0){D.cats.push({n:p.cat,c:Setup.colors[D.cats.length%Setup.colors.length],tax:''});ci=D.cats.length-1}

addAsk(){const D=DB.d,e=App.esc,accs=D.methods.filter(m=>m.type==='account');if(!accs.length)return App.toast('Create an account first');

</script><script>/* Print hub: food to Kitchen, drinks to Bar, bills and receipts to the Cash counter. Direct ESC/POS printing (USB, Serial/Bluetooth, network bridge) with a browser-print fallback and a job log. */

L.push({t:title,h:1});text.split('\n').forEach(wrap);c.height=L.length*lh+30;x.fillStyle='#fff';x.fillRect(0,0,W,c.height);x.fillStyle='#000';L.forEach((l,i)=>{const y=(i+1)*lh;if(l.h){x.font='bold 30px Arial, sans-serif';x.textAlign='center';x.direction='ltr';x.fillText(l.t,W/2,y)}else{x.font='bold 24px Arial, sans-serif';x.direction=l.r?'rtl':'ltr';x.textAlign=l.r?'right':'left';x.fillText(l.t,l.r?W-4:4,y)}});return this.pack(x.getImageData(0,0,W,c.height).data,W,c.height)},

async usb(p){if(!navigator.usb)throw new Error('USB printing is not available in this window');let c=this.conn[p.name];if(c&&c.dev.opened)return c;const dev=(await navigator.usb.getDevices()).find(x=>x.vendorId===p.vid&&x.productId===p.pid);if(!dev)throw new Error('USB printer is not paired');await dev.open();if(!dev.configuration)await dev.selectConfiguration(1);let ifc=null,ep=null;for(const i of dev.configuration.interfaces){const a=i.alternates[0],e=a.endpoints.find(x=>x.direction==='out');if(e&&(a.interfaceClass===7||ifc===null)){ifc=i.interfaceNumber;ep=e.endpointNumber}}if(ifc===null)throw new Error('No printer port found');await dev.claimInterface(ifc);return this.conn[p.name]={dev,ep}},

</script><script>/* Walk-In: new order screen with the live menu, Walk-In Orders, Unpaid Orders, QR code and digital menu. */

neu(){const D=DB.d,key=this.key();Order.t=key;const o=DB.order(key),k=DB.calc(o),cur=D.settings.currency,ids=Object.keys(o.items),e=App.esc,t=s=>App.t(s),placed=!!o.no;if(Order.cat!==null)this.all=false;

else if(this.all){right=`<div class="crumb"><span><a href="javascript:WalkIn.toggleAll()">&#8962; ${t('Menu Categories')}</a> &rsaquo; Full menu (${D.menu.length} items)</span></div>${D.cats.map((c,i)=>{const L=D.menu.filter(m=>m.cat===i);return L.length?`<h3 class="wk-h">${e(c.n)}</h3><div class="items">${L.map(itm).join('')}</div>`:''}).join('')}`}

place(){const key=this.key();Order.t=key;const o=DB.order(key);if(!Object.keys(o.items).length)return App.toast('Add at least one item');const had=!!o.no;o.at=o.at||Date.now();Order.place();if(!had&&DB.order(key).no){const w=this.st();if(w.cur===key)w.cur=null}DB.save()},
list(kind){const D=DB.d,e=App.esc,u=this.unpaid(),day=864e5,from=this.per==='today'?new Date().setHours(0,0,0,0):this.per==='week'?Date.now()-7*day:0,paid=kind==='all'?D.sales.filter(s=>s.type==='Walk-In'&&s.time>=from).sort((a,b)=>b.time-a.time):[],cnt=o=>Object.values(o.items).reduce((s,x)=>s+x,0);
